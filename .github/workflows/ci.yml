# The gates, off this developer's machine.
#
# `.githooks/` already runs rustfmt, clippy, the rustdoc gate and the Mnemosyne SSOT check on every
# commit — but all of it on ONE Linux box. A platform nobody builds is a platform nobody supports,
# and this repository has been carrying exactly that: `README.md` promised Windows while
# `crates/sprag-peer/src/lib.rs` imported `std::os::unix::net` at the crate root, ungated, which
# cannot compile there at all. Nothing caught it because nothing else ever built the tree.
#
# So this file's job is not to duplicate the hooks. It is to check the claims the hooks cannot: that
# the tree builds somewhere other than here.
#
# WHAT IS DELIBERATELY NOT HERE YET
#
#   * The GUI crate, IN THE HEADLESS JOBS. `--exclude sprag-gui` is not a cost dodge: the remaining
#     workspace compiles no GPU or windowing crate at all (measured with `cargo tree -i`: wgpu,
#     winit, vello, ash, wayland and x11 are each ABSENT). That makes those jobs a GATE on the
#     headless/display split the architecture rests on.
#
#     ⚠ IT IS NO LONGER ABSENT FROM THIS FILE. The exclusion said what those jobs must not build; it
#     was read for a year as what CI does not build at all, and the residue was measured and
#     registered: 324 tests in two binaries green only on their author's box, and a pixel smoke that
#     was RED for eleven rounds with nobody looking. The `pixel (linux)` job below is where the
#     display half runs — separately, so the exclusion above keeps meaning exactly what it says.
#
#     ⚠ The first run of this file measured the other half of that claim FALSE. It said the
#     remaining workspace needs no system packages, and the Linux job failed building
#     `yeslogic-fontconfig-sys`. `sprag-rpc` -> `pinion-rpc-transport` -> `pinion-rpc` ->
#     `pinion-text` -> `parley` -> `fontique` pulls a TEXT-SHAPING stack into every crate that
#     speaks the wire, and on Linux `fontique` needs fontconfig's headers. Two things worth
#     recording:
#       - the original claim was checked with `cargo tree -i fontconfig`, which reports ABSENT
#         because the package is named `yeslogic-fontconfig-sys`. A probe by the wrong name reports
#         a false absence.
#       - this developer's box has `libfontconfig-dev` installed, so nothing local could ever have
#         caught it. That is what this file is for.
#     The `libfontconfig-dev` step below is what makes the job pass TODAY. The real fix is upstream
#     and is written up in `claudedocs/PINION-PR85-RPC-PULLS-TEXT-SHAPING.md`: a JSON-RPC crate
#     should not make a headless daemon link a font stack.
#   * Windows. It is not built because it is not claimed. See `README.md`.
#   * The Mnemosyne gates. They need `mnemosyne-cli`, which is not published; the commit hook is
#     their home.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  headless-linux:
    name: headless (linux)
    runs-on: ubuntu-latest
    # ⚠ A HANG IS NOT A RESULT, AND THE DEFAULT IS SIX HOURS OF SILENCE.
    #
    # GitHub's default job timeout is 360 minutes and a job's log is not downloadable until it ends,
    # so a suite that wedges says NOTHING for six hours and then says nothing about why. That is not
    # a hypothetical: the macOS job below wedged in `sprag-host`'s `cli.rs` and four consecutive
    # runs sat in it for 2.5-3.5 hours each. Five rounds recorded macOS as "unmeasured, the runners
    # never report" — the runners were reporting fine; the suite was hung, and nothing here could
    # say so. This bound turns that into a red job with a log, which is what a person can act on.
    #
    # Generous against the measured Linux run (11 min) on purpose: it is a WEDGE detector, not a
    # performance budget, and a gate that fires on a slow runner is a gate people learn to re-run.
    timeout-minutes: 45
    # ONE declaration for both the suite and the guard that judges it. Two copies is how the guard
    # came to be pointed somewhere the suite never wrote (see the guard step).
    #
    # ⚠ `github.workspace` and not `runner.temp`, and the difference is not cosmetic: **the `runner`
    # context does not exist in a job-level `env:`** — it is a step-level context, and a workflow
    # that names it here does not fail a step, it fails to START, with no jobs and no log. R343
    # pushed exactly that and got a run that ended in the same second it began. A YAML file that
    # PARSES is not a workflow that RUNS; `yaml.safe_load` cannot see a context that is out of scope.
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/../ambient/config
      XDG_DATA_HOME: ${{ github.workspace }}/../ambient/data
      XDG_STATE_HOME: ${{ github.workspace }}/../ambient/state
    steps:
      - uses: actions/checkout@v4

      # Needed by `yeslogic-fontconfig-sys`, which the wire crates pull in through `pinion-rpc`
      # (see the note at the top of this file). NOT needed on macOS, where `fontique` uses
      # Core Text and links no fontconfig at all — which is why only this job wants it.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # `--all` is safe here, unlike in the commit hook: since PR-22 the pinion crates are GIT
      # dependencies rather than path dependencies, so the workspace members rustfmt walks are
      # sprag's own and it cannot reach into pinion's tree.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude sprag-gui --all-targets

      # ⚠⚠⚠ THE SUITE DRIVES `sprag-term` AS A PROCESS, AND `cargo test` DOES NOT LEAVE A RECORD OF
      # HOW IT WAS BUILT.
      #
      # This step is not a warm-up. `cargo test --workspace` UPLIFTS `target/debug/sprag-term` and
      # writes no `target/debug/sprag-term.d` beside it — measured, by deleting the depfile and
      # running exactly the command below this one. Only `cargo build` writes the uplifted depfile.
      #
      # `sprag_gate::sibling_bin` reads that depfile to answer *was this binary built from the
      # source in this tree*, and it refuses to pass when it cannot tell — correctly, because the
      # alternative is a suite that drives a stale daemon and reports green (three wrong readings in
      # a row, R358). With no build step there is nothing for it to read, so the guard refused the
      # whole pty and MCP suite on this runner in the commit that added it.
      #
      # ⚠ The macOS job has had this step all along, which is why its failure was the OTHER defect
      # and not this one. Two jobs that differ in a step differ in what they can catch.
      - name: Build
        run: cargo build --workspace --exclude sprag-gui

      # `--no-fail-fast` because a plain run stops at the FIRST failing binary, which reports one
      # failure and hides the rest. The exit code is the verdict; a summary read out of the log is
      # not (interleaved output drops lines).
      #
      # The XDG variables are the guard the step below checks, and they are set HERE because the
      # suite has to run under them for that step to have anything to look at.
      - name: Test
        run: |
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          cargo test --workspace --exclude sprag-gui --no-fail-fast

      # ⚠⚠ THE SUITE MUST NOT WRITE THE HOME OF WHOEVER RAN IT.
      #
      # What this checks, why no test can be it, and what the `find` that used to live here got
      # wrong are all in `crates/sprag-gate/src/lib.rs` — beside the code, where the next person to
      # touch it will be. The short version: R341 measured `cargo test` creating
      # `~/.config/sprag/config.toml` on the developer's box, and R342's shell guard for it looked
      # at the PARENT of the three homes and so failed on every run it ever had.
      #
      # `if: always()` because a suite that FAILED can still have written the file, and that is
      # exactly when a person needs to know: it is the shape that makes a failure unreproducible
      # anywhere else. `-p sprag-gate` builds a crate with NO dependencies, so this still runs — and
      # still means something — after a step that failed to compile the product.
      #
      # Locally, the same binary under the same three variables: see the bin's own docs.
      - name: The suite must not write the home of whoever ran it
        if: always()
        run: cargo run -q -p sprag-gate --bin ambient-home-guard

  pixel-linux:
    name: pixel (linux)
    runs-on: ubuntu-latest
    # THE GATE THAT LOOKS AT PIXELS, AND THE REASON IT IS HERE.
    #
    # `sprag-smoke` is the only check in this repository that asserts on what a person would SEE. It
    # lived outside every automated gate — not in this file, not in `pre-commit` — so its number was
    # only ever as current as the last round that felt like running it. R349 shipped a paint change
    # without it and it stayed RED for ELEVEN rounds while every job here was green. A gate nobody
    # runs goes red in silence.
    #
    # ⚠ THE `--exclude sprag-gui` AT THE TOP OF THIS FILE IS NOT CONTRADICTED. That exclusion makes
    # the two headless jobs a GATE on the headless/display split: the remaining workspace must
    # compile no GPU or windowing crate. This job is the other side of the same line — it is the ONLY
    # one that builds the display half, and it says so by being separate rather than by widening
    # theirs.
    #
    # WHY THIS CAN RUN WITHOUT A GPU: Mesa's lavapipe is a software Vulkan device, and `sprag-smoke`
    # points `VK_ICD_FILENAMES` at it itself (see the bin's own docs — it derives the ICD path,
    # because the file lost its arch suffix once already).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # MEASURED, NOT GUESSED, AND THE MEASUREMENT IS CHECKED FOR COMPLETENESS.
      #
      # `ldd` on the GUI reports almost nothing — winit and the Vulkan loader bring their X11 and
      # driver libraries in with `dlopen`, so a list read off the link line is wrong in exactly the
      # places that matter. So: run the client under `LD_DEBUG=libs`, take every object it actually
      # initialised (58), and map each back to its package with `dpkg -S` (50 packages, none
      # unowned). Then check that this seven-line list REACHES them — `apt-cache depends --recurse`
      # over it is 160 packages and contains 46 of the 50.
      #
      # The four it does not contain were attributed rather than waved at: `libacl1` is loaded by
      # `sed`, `libgmp10` by `expr`, `libseccomp2` by `manpath` — `xvfb-run`'s own shell helpers,
      # which no client of ours ever calls, and the GUI's trace loads none of the four.
      #
      # This repository has a scar from the other approach — `crates/sprag-gate` exists because a
      # gate written straight into this file was never tested and failed unconditionally on every
      # run that carried it.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            xvfb \
            mesa-vulkan-drivers \
            libvulkan1 \
            libxkbcommon-x11-0 \
            libxcursor1 \
            libxi6

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      # ONE invocation for the whole set, and that is not tidiness: the smoke drives a daemon and a
      # terminal client beside the GUI, and a set built piecemeal is how a stale binary once cost
      # four cycles. RELEASE, because the smoke's frame budgets are written against an optimised
      # client — a debug build under a software rasteriser is a different machine.
      - name: Build the smoke set
        run: cargo build --release -p sprag-gui -p sprag-host -p sprag-tui

      # THE OTHER HALF OF WHAT THIS JOB IS FOR, and it is bigger than the smoke: `--exclude
      # sprag-gui` means the GUI crate's own tests — 324 of them in two binaries — were green only
      # on the machine that wrote them. They need no display (they drive pinion's reactive owner,
      # not a window), so they run here as an ordinary test step and the exclusion above them stops
      # being a hole nobody had measured.
      #
      # `--no-fail-fast` for the reason the headless jobs use it: a plain run stops at the first
      # failing binary and hides the rest.
      - name: The GUI's own tests
        run: cargo test -p sprag-gui --no-fail-fast

      # A fresh XDG home per run, because the smoke writes user config and a run that read the
      # runner's would be asserting about the image rather than about sprag.
      - name: Pixel smoke
        run: |
          export XDG_CONFIG_HOME="${{ github.workspace }}/../pixel/config"
          export XDG_DATA_HOME="${{ github.workspace }}/../pixel/data"
          export XDG_STATE_HOME="${{ github.workspace }}/../pixel/state"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          xvfb-run -a ./target/release/sprag-smoke

  headless-macos:
    name: headless (macos)
    runs-on: macos-latest
    # See the Linux job. THIS is the job that measured why the bound is needed: it wedged in
    # `sprag-host`'s `cli.rs` and four runs sat there for hours apiece, saying nothing, because a
    # job's log cannot be read until the job ends. Cancelling one by hand is what finally produced
    # the log that named the binary.
    timeout-minutes: 45
    # See the Linux job for why this is `github.workspace` and not `runner.temp`.
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/../ambient/config
      XDG_DATA_HOME: ${{ github.workspace }}/../ambient/data
      XDG_STATE_HOME: ${{ github.workspace }}/../ambient/state
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      # THE POINT OF THIS JOB. sprag's Unix support has never been built anywhere but Linux, so
      # "Unix" has been a claim rather than a fact — `target_os = "macos"` appears in four places
      # against seventy-two for Linux. A red first run here is not a regression; it is the first
      # measurement, and what it finds is a defect that was already there.
      - name: Build
        run: cargo build --workspace --exclude sprag-gui

      # THE COMMIT-MESSAGE GATE NEEDS A grep THAT HAS -P, AND THIS RUNNER SHIPS BSD grep, WHICH
      # DOES NOT. Without it `.githooks/commit-msg` refuses every message — correctly, since its
      # emoji and English-only rules have no other implementation and it will not pass what it
      # cannot check — so `sprag-gate`'s four end-to-end gates measure a machine that cannot run the
      # hook rather than a hook that is wrong.
      #
      # ⚠⚠⚠ INSTALLED RATHER THAN SKIPPED, and that is the same repair register item 454 made on a
      # build machine that could not enforce these rules either: the answer to *this host cannot run
      # the gate* is to make the host able, never to stop asking. A skip here would leave every Mac
      # in the project committing whatever it liked with nothing to say so.
      #
      # ⚠ The path is the hook's own advice, printed in its refusal.
      - name: GNU grep, which the commit-message gate has no substitute for
        run: |
          brew install grep
          echo "$(brew --prefix)/opt/grep/libexec/gnubin" >> "$GITHUB_PATH"

      # Both halves duplicated from the Linux job deliberately: the guard below is a claim about
      # what THE SUITE does, and a claim checked on one platform is a claim about that platform. A
      # call site that resolves the ambient home only where `cfg(unix)` splits would otherwise be
      # caught on one runner and shipped by the other.
      - name: Test
        run: |
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          cargo test --workspace --exclude sprag-gui --no-fail-fast

      # See the Linux job for what this is and why a test cannot be it.
      - name: The suite must not write the home of whoever ran it
        if: always()
        run: cargo run -q -p sprag-gate --bin ambient-home-guard
