# The gates, off this developer's machine.
#
# `.githooks/` already runs rustfmt, clippy, the rustdoc gate and the Mnemosyne SSOT check on every
# commit — but all of it on ONE Linux box. A platform nobody builds is a platform nobody supports,
# and this repository has been carrying exactly that: `README.md` promised Windows while
# `crates/sprag-peer/src/lib.rs` imported `std::os::unix::net` at the crate root, ungated, which
# cannot compile there at all. Nothing caught it because nothing else ever built the tree.
#
# So this file's job is not to duplicate the hooks. It is to check the claims the hooks cannot: that
# the tree builds somewhere other than here.
#
# WHAT IS DELIBERATELY NOT HERE YET
#
#   * The GUI crate. `--exclude sprag-gui` is not a cost dodge: the remaining workspace compiles no
#     GPU or windowing crate at all (measured with `cargo tree -i`: wgpu, winit, vello, ash,
#     wayland and x11 are each ABSENT). That makes these jobs a GATE on the headless/display split
#     the architecture rests on.
#
#     ⚠ The first run of this file measured the other half of that claim FALSE. It said the
#     remaining workspace needs no system packages, and the Linux job failed building
#     `yeslogic-fontconfig-sys`. `sprag-rpc` -> `pinion-rpc-transport` -> `pinion-rpc` ->
#     `pinion-text` -> `parley` -> `fontique` pulls a TEXT-SHAPING stack into every crate that
#     speaks the wire, and on Linux `fontique` needs fontconfig's headers. Two things worth
#     recording:
#       - the original claim was checked with `cargo tree -i fontconfig`, which reports ABSENT
#         because the package is named `yeslogic-fontconfig-sys`. A probe by the wrong name reports
#         a false absence.
#       - this developer's box has `libfontconfig-dev` installed, so nothing local could ever have
#         caught it. That is what this file is for.
#     The `libfontconfig-dev` step below is what makes the job pass TODAY. The real fix is upstream
#     and is written up in `claudedocs/PINION-PR85-RPC-PULLS-TEXT-SHAPING.md`: a JSON-RPC crate
#     should not make a headless daemon link a font stack.
#   * Windows. It is not built because it is not claimed. See `README.md`.
#   * The Mnemosyne gates. They need `mnemosyne-cli`, which is not published; the commit hook is
#     their home.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  headless-linux:
    name: headless (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed by `yeslogic-fontconfig-sys`, which the wire crates pull in through `pinion-rpc`
      # (see the note at the top of this file). NOT needed on macOS, where `fontique` uses
      # Core Text and links no fontconfig at all — which is why only this job wants it.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # `--all` is safe here, unlike in the commit hook: since PR-22 the pinion crates are GIT
      # dependencies rather than path dependencies, so the workspace members rustfmt walks are
      # sprag's own and it cannot reach into pinion's tree.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude sprag-gui --all-targets

      # `--no-fail-fast` because a plain run stops at the FIRST failing binary, which reports one
      # failure and hides the rest. The exit code is the verdict; a summary read out of the log is
      # not (interleaved output drops lines).
      #
      # The XDG variables are the guard the step below checks, and they are set HERE because the
      # suite has to run under them for that step to have anything to look at.
      - name: Test
        run: |
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          cargo test --workspace --exclude sprag-gui --no-fail-fast
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/ambient/config
          XDG_DATA_HOME: ${{ runner.temp }}/ambient/data
          XDG_STATE_HOME: ${{ runner.temp }}/ambient/state

      # ⚠⚠ THE SUITE MUST NOT WRITE THE HOME OF WHOEVER RAN IT.
      #
      # R341 measured `cargo test` creating `~/.config/sprag/config.toml` on the developer's box: a
      # test ran `sprag set-option window-size manual` through a helper that passes no environment,
      # so the child resolved the AMBIENT config home. A SIBLING unit test then read that file, and
      # was green here and red on every host without it. `cargo test` silently edited the user's
      # terminal configuration, and the suite's own green was resting on the edit.
      #
      # A test cannot be this guard. `XDG_CONFIG_HOME` is process-global, so a test can neither
      # observe nor isolate what the tests running beside it do to it — the fix for any ONE call
      # site is a seam, and nothing makes the NEXT call site take one. The guard has to stand
      # outside the suite, which is what this step is.
      #
      # `if: always()` because a suite that FAILED can still have written the file, and that is
      # exactly when a person needs to know: it is the shape that makes a failure unreproducible
      # anywhere else.
      #
      # Locally: run the suite with the three variables pointed at a fresh directory and run the
      # same `find`. That is the measurement that found the defect, so it is known to discriminate.
      - name: The suite must not write the home of whoever ran it
        if: always()
        run: |
          wrote=$(find "${{ runner.temp }}/ambient" -mindepth 1 2>/dev/null || true)
          if [ -n "$wrote" ]; then
            echo "::error::the test suite wrote the ambient XDG home. On a developer's machine"
            echo "::error::that is THEIR ~/.config, and a sibling test that reads it is green"
            echo "::error::here and red everywhere else. Give the call site below a seam."
            echo "$wrote"
            exit 1
          fi
          echo "the suite left the ambient config, data and state homes untouched"

  headless-macos:
    name: headless (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      # THE POINT OF THIS JOB. sprag's Unix support has never been built anywhere but Linux, so
      # "Unix" has been a claim rather than a fact — `target_os = "macos"` appears in four places
      # against seventy-two for Linux. A red first run here is not a regression; it is the first
      # measurement, and what it finds is a defect that was already there.
      - name: Build
        run: cargo build --workspace --exclude sprag-gui

      # Both halves duplicated from the Linux job deliberately: the guard below is a claim about
      # what THE SUITE does, and a claim checked on one platform is a claim about that platform. A
      # call site that resolves the ambient home only where `cfg(unix)` splits would otherwise be
      # caught on one runner and shipped by the other.
      - name: Test
        run: |
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          cargo test --workspace --exclude sprag-gui --no-fail-fast
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/ambient/config
          XDG_DATA_HOME: ${{ runner.temp }}/ambient/data
          XDG_STATE_HOME: ${{ runner.temp }}/ambient/state

      # See the Linux job for what this is and why a test cannot be it.
      - name: The suite must not write the home of whoever ran it
        if: always()
        run: |
          wrote=$(find "${{ runner.temp }}/ambient" -mindepth 1 2>/dev/null || true)
          if [ -n "$wrote" ]; then
            echo "::error::the test suite wrote the ambient XDG home. On a developer's machine"
            echo "::error::that is THEIR ~/.config, and a sibling test that reads it is green"
            echo "::error::here and red everywhere else. Give the call site below a seam."
            echo "$wrote"
            exit 1
          fi
          echo "the suite left the ambient config, data and state homes untouched"
