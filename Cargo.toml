# sprag cargo workspace.
#
# Structure mirrors the core/plugin split recorded in the design SSOT
# (docs/.atomic, DESIGN.md §2). This iteration is the walking-skeleton
# vertical slice (DESIGN.md §5): PTY -> termwiz parser -> sprag emulator
# -> GridBuffer projection -> pinion Scene::TextGrid -> scene/snapshot.
#
# pinion is referenced by path because it is unpublished (DESIGN.md §5
# caveat). sprag and pinion are sibling checkouts under the same parent.

[workspace]
resolver = "3"
# Members are added incrementally as each crate of the walking-skeleton
# slice lands: sprag-vt (emulator) -> sprag-grid (projection) ->
# sprag-terminal (pinion host).
members = [
    "crates/sprag-vt",
    "crates/sprag-grid",
    # What a pane is DOING, read from its screen and title (H3 slice 1). Pure like
    # sprag-grid and for the same reason: a verdict about somebody else's UI is only
    # honest if a captured screen can be replayed against it.
    "crates/sprag-detect",
    "crates/sprag-input",
    "crates/sprag-terminal",
    "crates/sprag-host",
    "crates/sprag-plugin",
    "crates/sprag-rpc",
    # The display-INDEPENDENT half of a display client (H1 slice 1): the wire
    # client both frontends share, so the terminal client that lets a session be
    # attached over ssh does not have to re-spell the wire. GPU-free by gate.
    "crates/sprag-client",
    # The TERMINAL frontend (H1 slice 2): the same wire client painted as escape
    # sequences instead of pixels, so a session can be attached over ssh. GPU-free
    # by its own gate — this is the binary that runs on the box without a GPU.
    "crates/sprag-tui",
    # The GPU windowed host (read-only terminal viewer). The ONLY crate that
    # depends on pinion-shell/vello — the headless RPC path stays GPU-free.
    "crates/sprag-gui",
    # The agent-facing MCP surface: a stdio server that lets an AI running INSIDE
    # a pane read/drive its sibling panes over the host wire (discoverable north star).
    "crates/sprag-mcp",
    # DEV-ONLY: the older daemon four test files had each spelled out for themselves, in
    # three different refusal policies (R324). No binary depends on it; every front's
    # skew test does.
    "crates/sprag-peer",
    # DEV-ONLY: the property claims over a PUBLISHED CALL GRAMMAR, written once for the five
    # surfaces that publish one — three in sprag-host's scene, three in the GUI's. A `#[cfg(test)]`
    # module cannot cross a crate boundary, and a fourth copy of each claim is exactly what the
    # feature refuses (each copy passes on its own surface). Depends ON sprag-host while being a
    # dev-dependency OF it, which cargo permits for a test-only helper.
    "crates/sprag-conformance",
    # DEV-ONLY: the gates whose subject is what the SUITE did, so no test can be one — the
    # environment they judge is process-global (R341/R343). Written in Rust rather than in the
    # workflow file because the first one lived in `ci.yml`, was never tested, and failed
    # unconditionally on every run that carried it.
    "crates/sprag-gate",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
authors = ["newmassrael <newmassrael@gmail.com>"]
repository = "https://github.com/newmassrael/sprag"

[workspace.dependencies]
# pinion — GIT + REV PINNED (PR-22 endgame, R54). sprag NO LONGER reads the sibling
# ../pinion working tree: an in-progress / non-compiling pinion edit can never block
# sprag's build or commit. Flip side: a pinion change reaches sprag ONLY when it is
# pushed AND this rev is bumped (no live-dogfood auto-pickup). TO TAKE A NEW PINION:
# push pinion, then set `rev` on every pinion-* line below to the new commit AND set
# the SCE rev (the [workspace.dependencies] SCE block) to pinion@<rev>'s own SCE rev,
# so the single shared SCE instance is preserved (see the SCE block). `package=` is
# omitted (dep key == crate name; pinion crates are workspace members of the repo).
# (DESIGN.md §5's "path deps — unpublished" rationale is superseded here by PR-22.)
pinion-core = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }
pinion-a11y = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }
pinion-shell = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }
# pinion-gpu (R1537): the wgpu device pinion owns so it can request TIMESTAMP_QUERY,
# which vello's own RenderContext cannot carry. NOT a dependency sprag chose: the
# `vello_renderer_impl!` expansion names `::pinion_gpu::{GpuError, GpuContext,
# FrameTimer, GpuFrameClock}` in the crate root, so every macro consumer declares it.
# sprag-gui alone, like every other GPU dep here.
pinion-gpu = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }
# pinion-runtime: the shell's input/focus runtime. sprag-gui uses it only as a
# DEV-dependency, for `PointerId` in the end-to-end click-to-focus test (the
# shell's pointer methods take it); not a runtime dependency of any sprag crate.
pinion-runtime = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }
# Backend-agnostic widget paint helpers (GPU-free; deps core/text/a11y, already
# under pinion-shell). sprag-gui uses `view_splitter` + `SplitterExternal` for
# the draggable pane dividers (R38).
pinion-widget-paint = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }
# Platform clipboard bridge (arboard: X11 PRIMARY/CLIPBOARD, Wayland, mac, Win).
# sprag-gui uses `use_app_clipboard` for mouse-select copy + paste (R139).
pinion-platform-clipboard = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }
pinion-forge = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }
# pinion-rpc: the scene-as-data introspection wire (snapshot.rs) + dispatch.
# Confined to sprag-host (the RPC server layer) so the producer/projection
# crates stay free of its heavy transitive deps (DESIGN.md §3/§5: the data
# path needs no display).
pinion-rpc = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }
# pinion-rpc-transport (PR-47/R1263): the reusable Unix-socket adapter over
# pinion's winit-free RpcIngress seam. sprag-gui mounts it via the shell's
# `on_rpc_ingress` hook so the RPC endpoint is a fixed-path socket (always
# there, execution-independent) instead of the process's stdin. Depends only
# on the seam, so it stays free of the shell's GPU deps.
pinion-rpc-transport = { git = "https://github.com/newmassrael/pinion.git", rev = "38c908b23ebafeb6e649c76e88b78de850b94115" }

# VT toolkit (DESIGN.md §4): termwiz is the embedded verified escape
# parser + cell/color/input primitives. The emulator state machine is
# sprag-owned (sprag-vt), isolated behind VtPort.
termwiz = "0.23"


# SIGUSR1 runtime toggle for the RPC socket endpoint (PR-47 consumer-owned
# policy): a dedicated `Signals::forever` thread flips TransportControl
# on/off. Already in the tree transitively; used directly here, no unsafe.
signal-hook = "0.3"
# PR_SET_PDEATHSIG: reap a GUI-spawned sprag-term child if the GUI dies
# ungracefully (kill-on-Drop covers the graceful path). Version tracks the
# already-resolved transitive (via signal-hook).
libc = "0.2"

# D-Bus, for ONE call: the daemon asks its systemd user manager for a
# delegated cgroup subtree at startup (R336), so a pane's share of the machine
# can be enforced. `StartTransientUnit` with a `PIDs` property is the only way
# to move an ALREADY-RUNNING process into a new scope — `systemd-run` starts a
# command instead, so the CLI cannot express it at all.
#
# Confined to sprag-host, which already declares itself the home for heavy
# transitive deps (pinion-rpc), and Linux-gated there: cgroups are the only
# thing this is for. Already resolved in the tree via the GUI's clipboard
# stack, so it costs the workspace no new download.
zbus = "5"

# JSON parsing for tests that assert on the scene/snapshot RPC wire.
#
# `preserve_order` is on for `sprag_host::hooks`, which edits an AGENT's own `settings.json`: the
# default `Map` is a `BTreeMap`, so a read/edit/write round trip would alphabetise every object in
# a file sprag does not own. With it, a map serialises in insertion order instead — a change no
# consumer in this tree reads (JSON-RPC defines no key order), and the one that makes "preserve
# what is already in the file" true rather than approximate.
serde_json = { version = "1", features = ["preserve_order"] }

# serde derive for sprag-host's wire DTOs (the pane `cells`-frame facts). Version
# matches pinion's so the one serde instance is shared across the dep graph.
serde = { version = "1", features = ["derive"] }

# Base64 for inline-image (Kitty graphics) payload decode + the wire RGBA carry
# (pinion R1404). Matches termwiz's transitive version, so no duplicate in the lock.
base64 = "0.22"

# PNG decode for the Kitty graphics `f=100` image format (pinion R1404 Stage 4).
# Version matches the already-resolved transitive (via vello / image), so no lock dup.
png = "0.17"

# Production logging: first-party diagnostics are leveled `tracing` events
# (targets like `sprag_gui::dock`), env-filtered by log level — NOT ad-hoc
# eprintln. Versions match pinion's so the one global subscriber is shared.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cell display width (UAX#11) for the emulator's wide-cluster handling.
unicode-width = "0.2"
# Regular-expression search over a pane's retained output — a DISTINCT query beside the literal
# find, never a flag that reinterprets a needle. Already in the graph via termwiz -> fancy-regex,
# so this is a direct name for a crate sprag-vt already builds. The engine's linear-time guarantee
# is the reason a caller-supplied pattern is safe to run on the dispatch thread at all.
regex = "1"
# Per-project config (`.sprag.toml`): the commands a project declares for itself.
# TOML rather than JSON because the file is HAND-WRITTEN and committed, and a config
# a human maintains without comments is a real defect; it also matches this repo's own
# convention (Cargo.toml, mnemosyne.toml). Confined to sprag-host, which owns the policy.
toml = "1"
# EDITING the user's `config.toml` in place (`sprag bind-key` / `unbind-key`), which the
# serialize-from-a-struct path above cannot do: a keymap edit lands in a file the user maintains
# BY HAND, so their comments, ordering and unrelated tables have to survive it. Already in the
# lock as a transitive dependency, so naming it directly adds no new crate to the graph.
toml_edit = "0.25"

# Grapheme-cluster segmentation (UAX#29) for DEC mode 2027 (grapheme
# clustering): groups ZWJ emoji sequences, flags, and skin-tone / VS16
# sequences into one cell. Already in the lock (a transitive dep), so reusing
# it adds no new distinct crate.
unicode-segmentation = "1"

# Small-string storage for `Cell.cluster` (sprag-vt). A grapheme cluster is
# almost always one char (<= 4 bytes), so an inline SSO string keeps it in the
# cell's 24 bytes with NO heap allocation on the print path (the old `String`
# allocated per printed cell — the bulk-output throughput wall). Clone is O(1):
# an inline memcpy, or an `Arc` bump for the rare > 23-byte cluster, which the
# clone-heavy scrollback / reflow / selection paths get for free. Already in the
# lock via winit -> accesskit_winit -> pinion-shell, so this reuses the one
# resolved 0.2.x (no new distinct crate); bump in lockstep with a pinion rev bump
# if that ever moves winit's smol_str minor.
smol_str = "0.2"

# Vello pinned to pinion-shell's version so the forge renderer macro
# output type-checks against pinion's vello.
vello = "0.9"

# SCE (SCXML Core Engine) — the user's W3C SCXML 1.0 engine with multi-language
# AOT codegen. sprag's orchestration control logic is authored as SCXML and
# codegen'd via SCE (memory: use-sce-for-statecharts), mirroring pinion-forge's
# usage. These MUST resolve to the SAME Cargo package as pinion's SCE, because
# pinion-core's widget facade is generic over `sce_rust_runtime::{Engine,
# StatePolicy}` and sprag builds on that facade — two instances would type-clash.
# Cargo unifies on source_id, and `path` and `git` are never the same source, so
# this MIRRORS pinion's `[workspace.dependencies]` SCE EXACTLY (same git url + rev
# + default-features) — pinion moved path → git+rev in its R1053 (PR-22), so sprag
# follows or the shared instance splits. `package=` is unneeded (dep name == crate
# name; SCE crates are workspace members of scxml-core-engine.git). To bump SCE:
# change the rev HERE and in pinion's workspace deps to the SAME value.
# sce-build is a build-dependency (build.rs codegen); the runtime carries the
# generated state machine. default-features off keeps http-send out.
sce-build = { git = "https://github.com/newmassrael/scxml-core-engine.git", rev = "084dfdbf4702169e7874bd18ad372e8b798ef3d7" }
sce-rust-runtime = { git = "https://github.com/newmassrael/scxml-core-engine.git", rev = "084dfdbf4702169e7874bd18ad372e8b798ef3d7", default-features = false }
# The ONE IScriptEngine implementation SCE ships at this rev. A statechart whose
# datamodel is anything but `null` is generated against a script engine the
# CONSUMER supplies (`Policy::new(Arc<dyn IScriptEngine>)`), and Lua is the only
# thing there is to supply — `sce-rust-runtime`'s own manifest calls QuickJS
# "future". Held here as a MEASUREMENT dependency (sprag-plugin takes it as a
# dev-dependency only) until something in the product needs to CONSTRUCT the
# machine: see `sprag_plugin::ai_loop`'s gates and PR-86's item 5.
sce-rust-lua = { git = "https://github.com/newmassrael/scxml-core-engine.git", rev = "084dfdbf4702169e7874bd18ad372e8b798ef3d7" }
# ⚠⚠⚠ PR-86 WAS DELIVERED AT THIS REV AND `log` IS GONE FROM THIS FILE. It was an
# INTERIM sprag never called: SCE's Rust codegen used to emit bare `log::error!` on
# every datamodel error path, so a machine with a script datamodel did not COMPILE
# in a crate that had not declared a crate it does not use (42 unresolved-crate
# errors for `ai_loop.scxml`; the two `null` machines emit zero, which is why sprag
# met this only at its third statechart). SCE `1d82948e` — *"Reach log through the
# runtime so consumers declare only SCE"* — makes the templates emit an
# `sce_log_*` facade that resolves `$crate::log`, so a consumer now names only the
# runtime it already depends on.
#
# ⚠⚠ AND THE DELETION IS THE GATE. Nothing asserts the facade in a test; what holds
# it is that `sprag-plugin` declares no `log` and compiles a script-datamodel
# machine. An SCE rev that regresses to a bare `log::error!` stops that crate
# building, which is the loudest signal available and costs nothing to keep.

# Internal crates.
sprag-vt = { path = "crates/sprag-vt", version = "0.0.1" }
sprag-grid = { path = "crates/sprag-grid", version = "0.0.1" }
sprag-detect = { path = "crates/sprag-detect", version = "0.0.1" }
sprag-input = { path = "crates/sprag-input", version = "0.0.1" }
sprag-terminal = { path = "crates/sprag-terminal", version = "0.0.1" }
sprag-host = { path = "crates/sprag-host", version = "0.0.1" }
sprag-conformance = { path = "crates/sprag-conformance", version = "0.0.1" }
sprag-plugin = { path = "crates/sprag-plugin", version = "0.0.1" }
# Frontend-agnostic RPC transport policy (always-on Unix socket + SIGUSR1/2
# control) over pinion's PR-47 seam; shared by sprag-gui and the headless host.
sprag-rpc = { path = "crates/sprag-rpc", version = "0.0.1" }
# The display-independent half of a display client: WireHost and everything else
# whose subject is the host relationship rather than what is drawn. Shared by
# sprag-gui and (H1) the terminal client; GPU-free by its own gate test.
sprag-client = { path = "crates/sprag-client", version = "0.0.1" }
# The CHARACTER-CELL half of a display client: pinion cells rendered as escape
# sequences, and the binary that owns a terminal to write them to. sprag-gui's
# peer, one unit down.
sprag-tui = { path = "crates/sprag-tui", version = "0.0.1" }
# The stand-in daemon every front's skew test drives. A DEV-dependency everywhere it
# appears — a cycle through dev-dependencies is one Cargo allows, and it is what keeps
# this out of every shipped binary.
sprag-peer = { path = "crates/sprag-peer", version = "0.0.1" }

# The checks a test cannot make about ITSELF. A DEV-dependency everywhere it appears, on
# `sprag-peer`'s terms and for the same reason: it depends on nothing of the product, so a
# suite that drives a sibling binary can ask whether that binary is CURRENT without the
# question being able to fail because the product did not compile.
sprag-gate = { path = "crates/sprag-gate", version = "0.0.1" }

# DEBUG INFO IS STORED ONCE PER CRATE, NOT COPIED INTO EVERY BINARY THAT LINKS IT.
#
# This workspace links 85 test binaries against the same dependency tree (its own crates plus
# pinion's), and cargo's default packs every crate's debug info into each one of them. Measured
# 2026-08-12, cold builds of `cargo test --workspace --no-run -j 4`, same 85 binaries:
#
#   |                | target total | executables | wall  |
#   | default        |    5.22 GB   |   3.11 GB   | 117 s |
#   | unpacked       |    4.38 GB   |   2.22 GB   | 116 s |
#
# Per binary: pty_round_trip 87 -> 56 MB, sprag_gui 160 -> 121 MB, sprag_host 126 -> 93 MB.
#
# ⚠ WHAT DOES NOT MOVE IS `.debug_line`, which is the half this project actually reads: it stays
# at 24.9 MB, byte for byte, so a failing test's backtrace keeps its file:line. What leaves the
# binary is `.debug_str` (27.2 -> 3.1 MB) and `.debug_info` (11.3 -> 2.1 MB) — a debugger's type
# and variable names — and those live in `.dwo` files beside the objects, which gdb/lldb resolve
# as long as the target tree is intact. A binary COPIED out of the tree loses them.
#
# ⚠ Wall time did NOT improve (117 vs 116 s). The link has less to copy and the compiler has more
# files to write, and the two cancel. Recorded because the opposite is the obvious guess.
#
# ⚠ NOT VALID ON `windows-msvc`, where only `packed` (PDB) is supported. sprag does not build for
# Windows today (blocked by the wire) and no CI job targets it; a later Windows port needs this
# key moved under a `[target.'cfg(not(windows))']`-style split, which Cargo does not yet offer for
# profiles — so it will need `.cargo/config.toml` or a feature of Cargo that does not exist yet.
# macOS already defaults to `unpacked` for dev, so this changes nothing there.
[profile.dev]
split-debuginfo = "unpacked"
