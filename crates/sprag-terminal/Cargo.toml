[package]
name = "sprag-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "PTY producer: owns the pseudoterminal + sprag-vt emulator, exposing the live terminal screen as queryable state (DESIGN.md §5)"
publish = false

[dependencies]
# The producer owns the emulator and the PTY only — no pinion dependency
# (scene assembly + RPC live in sprag-host).
sprag-vt = { workspace = true }
# Cross-platform PTY (README NFR: a verified portable abstraction).
# A window's logical layout crosses the wire to a display client (the
# detach/reattach arc), so it derives serde HERE — the one definition of the
# layout's field set, shared by the host's wire and every client.
serde = { workspace = true }
# The producer's one reporting channel. A pane teardown that cannot complete is
# invisible by construction (a destructor returns nothing), so the anomaly has to
# be LOGGED to exist at all — env-filtered levels, never eprintln.
tracing = { workspace = true }
# `SIGKILL`. `portable-pty`'s cloned killer offers only a polite `SIGHUP`, which a
# child may ignore; closing a pane needs a signal that cannot be refused.
libc = { workspace = true }

[dev-dependencies]
# The layout's wire round-trip proof (the detach/reattach fidelity guarantee).
serde_json = { workspace = true }
