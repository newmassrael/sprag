[package]
name = "sprag-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "GPU windowed host: an interactive terminal viewer that paints a pane's live Scene::TextGrid via pinion-shell/Vello (woken by the pinion R999 RepaintSink seam, the sprag R23 on_dirty hook) and routes keystrokes to the PTY through the pane External's invoke(\"key\") wire. The only sprag crate with a GPU dependency; the headless RPC path (sprag-host) stays GPU-free."
publish = false

[[bin]]
name = "sprag-gui"
path = "src/main.rs"

[dependencies]
# The Screen -> Scene::TextGrid projection SSOT (text_grid_node) + scene tags.
sprag-host = { workspace = true }
# The PTY producer: Workspace::spawn_with_dirty wires the R23 on_dirty hook to
# the RepaintSink, and the emulator screen is read each frame via with_screen.
sprag-terminal = { workspace = true }
pinion-core = { workspace = true }
# WidgetA11y for the (empty) access tree.
pinion-a11y = { workspace = true }
# The windowed GPU shell entry point (pinion_shell::run) + RepaintSink impl.
pinion-shell = { workspace = true }
# view_splitter + SplitterExternal — the draggable pane dividers (R38).
pinion-widget-paint = { workspace = true }
# PR-47: the reusable Unix-socket RPC transport mounted through the shell's
# `on_rpc_ingress` seam (rpc.rs) — a fixed-path, always-on endpoint.
pinion-rpc-transport = { workspace = true }
# SIGUSR1 runtime on/off toggle for the RPC socket (rpc.rs) — consumer-owned
# transport policy per PR-47.
signal-hook = { workspace = true }
# Pinned to pinion-shell's vello so the forge renderer macro output type-checks.
vello = { workspace = true }
# Build the {key, ctrl, ...} args for the pane External's invoke("key", ...)
# wire (the same scene/invoke channel the RPC path drives, R2.6).
serde_json = { workspace = true }
# Production logging (memory: production-logging-tracing): leveled `tracing`
# events for first-party diagnostics + a stderr subscriber installed in main()
# (env-filtered by SPRAG_LOG) before pinion's run() fallback.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
# Compiles app.pinion.xml -> OUT_DIR/app.rs (the Vello renderer scaffold).
pinion-forge = { workspace = true }

[dev-dependencies]
# `PointerId` for the end-to-end click-to-focus test (the shell's pointer methods
# take it). Test-only — no sprag crate depends on pinion-runtime at runtime.
pinion-runtime = { workspace = true }
