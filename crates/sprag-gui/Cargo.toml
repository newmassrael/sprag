[package]
name = "sprag-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "GPU windowed host: an interactive terminal viewer that paints a pane's live Scene::TextGrid via pinion-shell/Vello (woken by the pinion R999 RepaintSink seam, the sprag R23 on_dirty hook) and routes keystrokes to the PTY through the pane External's invoke(\"key\") wire. The only sprag crate with a GPU dependency; the headless RPC path (sprag-host) stays GPU-free."
publish = false

[[bin]]
name = "sprag-gui"
path = "src/main.rs"

[dependencies]
# The host's per-pane cell DATA query (pane_cells) + the Screen-free node
# assembly (pane_view_scene_from_cells) + scene tags — the topology-B wire seam
# the GUI consumes as a client (in-process for now).
sprag-host = { workspace = true }
# overlay_preedit: the CLIENT-local IME composition overlay on the host's cells
# (an uncommitted preedit never in the PTY). The cell projection SSOT itself lives
# host-side (pane_cells -> project_scrolled); this is the client's own half.
sprag-grid = { workspace = true }
# Modifiers: the encoder's modifier type the client passes to Host::send_key
# (the input-over-the-client path). The key->PTY encoding itself is host-side
# (sprag_host::send_key -> sprag_input::encode); this is just the typed arg.
sprag-input = { workspace = true }
# The PTY producer: Workspace::spawn_with_dirty wires the R23 on_dirty hook to
# the RepaintSink, and the emulator screen is read each frame via with_screen.
sprag-terminal = { workspace = true }
# ClipboardTarget / ClipboardTargets: the OSC 52 selection types the host's
# PaneClipboardWrite / PaneClipboardQuery carry — the GUI maps them onto pinion's
# ClipboardSelection when it applies a write / answers a read (crate::clipboard_osc).
sprag-vt = { workspace = true }
pinion-core = { workspace = true }
# WidgetA11y for the (empty) access tree.
pinion-a11y = { workspace = true }
# The windowed GPU shell entry point (pinion_shell::run) + RepaintSink impl.
pinion-shell = { workspace = true }
# view_splitter + SplitterExternal — the draggable pane dividers (R38).
pinion-widget-paint = { workspace = true }
# use_app_clipboard — mouse-drag select copy (PRIMARY/CLIPBOARD) + paste (R139).
pinion-platform-clipboard = { workspace = true }
# PR-47: sprag's shared RPC transport policy (always-on Unix socket + SIGUSR1/2
# control). The GUI mounts it (rpc.rs) on the shell's `on_rpc_ingress` seam;
# the reusable socket adapter + signal-hook are transitive through here. R115c
# also uses its HostConn client + runtime_path (the WireHost wire client).
sprag-rpc = { workspace = true }
# Pinned to pinion-shell's vello so the forge renderer macro output type-checks.
vello = { workspace = true }
# Build the {key, ctrl, ...} args for the pane External's invoke("key", ...)
# wire (the same scene/invoke channel the RPC path drives, R2.6).
serde_json = { workspace = true }
# Deserialize the host's `cells` wire frame (WireFrame flattens PaneScrollFacts).
serde = { workspace = true }
# Production logging (memory: production-logging-tracing): leveled `tracing`
# events for first-party diagnostics + a stderr subscriber installed in main()
# (env-filtered by SPRAG_LOG) before pinion's run() fallback.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
# Compiles app.pinion.xml -> OUT_DIR/app.rs (the Vello renderer scaffold).
pinion-forge = { workspace = true }

[dev-dependencies]
# `PointerId` for the end-to-end click-to-focus test (the shell's pointer methods
# take it). Test-only — no sprag crate depends on pinion-runtime at runtime.
pinion-runtime = { workspace = true }
