[package]
name = "sprag-agent-peer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "An AGENT that runs the hooks it was launched with, for the tests that need one: it reads `--settings`, resolves the hook command for an event, and runs it. DEV-ONLY - no sprag binary depends on it."
publish = false

[dependencies]
# The settings document is JSON and this stand-in PARSES it. A fixture that pulled the command out
# with a pattern would agree with the producer by construction and could never catch the producer
# writing a document an agent cannot read - which is the one thing it exists to catch.
serde_json = { workspace = true }

[[bin]]
name = "sprag-agent-peer"
path = "src/main.rs"
