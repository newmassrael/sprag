[package]
name = "sprag-gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The gates a test cannot be: checks whose subject is what the SUITE did, so they have to stand outside it. DEV-ONLY — no sprag binary depends on this."
publish = false

# No dependencies, deliberately. A gate that stands outside the suite must not be able to fail
# because the product failed to compile: the point of running it is to say something about a run
# that may itself have gone wrong (`if: always()` in CI). `std` is the whole toolkit it needs.
[dependencies]

# ⚠⚠ TEST-ONLY, and the one exception to the paragraph above — register items 794 and 825. The
# rule that matters is *a gate BINARY must build when the product does not*, and a dev-dependency
# cannot touch one: `ambient-home-guard`, `sweep-coverage`, `pty-demand` and `north-star` still
# compile against `std` alone.
#
# What it buys is the thing item 794 measured: `std::env::temp_dir()` returns a RELATIVE path when
# `TMPDIR` is set-and-empty, so a fixture that asked the operating system directly would write into
# this crate's own directory inside the repository. `sprag-scratch` is the one place that asks, it
# declares no dependencies of its own, and this workspace holds a RATCHET on the number of sites
# that still bypass it — so a new one is a red rather than a habit.
[dev-dependencies]
sprag-scratch = { workspace = true }

[[bin]]
name = "ambient-home-guard"
path = "src/bin/ambient-home-guard.rs"

# Register item 585: whether a sweep reached every crate, which no test inside the sweep can say.
[[bin]]
name = "sweep-coverage"
path = "src/bin/sweep-coverage.rs"

# Register item 817: how much of a pseudoterminal namespace one process asked for — a total the
# process cannot report about itself, and until this existed a number only a refusal printed.
[[bin]]
name = "pty-demand"
path = "src/bin/pty-demand.rs"

# Register item 823: what the north star's "zero" is counting. The population had two predicates
# and they disagreed on 32 of 45 items, so it becomes a mark each ledger item states.
[[bin]]
name = "north-star"
path = "src/bin/north-star.rs"
