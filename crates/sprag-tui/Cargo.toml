[package]
name = "sprag-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "sprag's TERMINAL frontend: a client that attaches to a sprag-term session and paints its panes as escape sequences instead of pixels, so a session can be attached over ssh. The character-cell half of a display client — sprag-client owns the host relationship and knows nothing about cells, exactly as it knows nothing about pixels. GPU-free BY GATE (tests/gpu_free.rs), because the machine this runs on is the one that has no GPU."
publish = false

[[bin]]
name = "sprag-tui"
path = "src/bin/sprag-tui.rs"

[dependencies]
# The host relationship, shared with sprag-gui: WireHost is the whole topology-B
# client (poll thread, session scoping, the fetch gate, the frame decode). This
# crate adds a UNIT (character cells) to it and nothing else.
sprag-client = { workspace = true }
# The HostClient protocol both frontends consume — the trait WireHost implements,
# and the ONE definition of what a client may ask a host for.
sprag-host = { workspace = true }
# PaneId: the pane address a client reads cells at.
sprag-terminal = { workspace = true }
# `Modifiers` — the four-flag modifier set `HostClient::send_key` carries, defined in the
# crate that ENCODES keys at the PTY boundary. The key decoder produces the input to that
# encoder, so it necessarily speaks its vocabulary. GPU-free: a producer-layer crate whose
# only dependency is sprag-vt.
sprag-input = { workspace = true }
# `MouseProtocol` — the pane's mouse TRACKING LEVEL, which the client mirrors onto the
# local terminal. Already a public type of the HostClient protocol above
# (`pane_mouse_protocol` answers with it), so this is a direct use of something already
# in the tree rather than a new edge. Promoted OUT of [dev-dependencies], where it was
# for the paint tests: a production `use` from a dev-only dependency does not build.
# GPU-free: sprag-vt is the emulator, and the paint tests already depended on it.
sprag-vt = { workspace = true }
# GridBuffer (the cells this crate paints) + QuitSink (the client's quit edge, which
# the poll thread pulls when the daemon is gone). GPU-FREE: pinion's data layer.
pinion-core = { workspace = true }
# The prompt row is truncated a CLUSTER at a time (crate::paint): a wide glyph either fits in the
# columns that are left or does not go on the row at all, and splitting one would put half a
# syllable at the edge. Same crate the shared editor steps with, and the emulator clusters with.
unicode-segmentation = { workspace = true }
# `ProjectionToken` — the per-row damage stamps a frame arrives with, which is what lets
# `PaintCache` rebuild only the rows that can have changed. Promoted OUT of [dev-dependencies],
# where it was for the paint tests' real projection: a production `use` from a dev-only
# dependency does not build. GPU-free: its whole closure is pinion-core + sprag-vt, both of
# which this crate already depends on.
sprag-grid = { workspace = true }
# The terminal toolkit: Surface + its terminfo renderer (paint), and the local
# terminal's raw/alternate-screen control. NOT a new dependency — sprag-vt already
# parses what panes EMIT with it, and this crate writes what a terminal DISPLAYS.
termwiz = { workspace = true }
# Production logging (memory: production-logging-tracing). No subscriber is installed
# by the binary; see its docs for why a TUI must not write to its own screen.
tracing = { workspace = true }

[dev-dependencies]
# (sprag-vt and sprag-grid are normal dependencies above — the VT battery the paint tests
# drive real escape sequences through is the same crate the mouse mirror reads its levels
# from, and the projection the tests build their GridBuffers with is the same one
# `PaintCache` reads tokens from.)
# The PTY gate (tests/pty_round_trip.rs) needs a real pseudoterminal to run the shipped
# binary on — the same abstraction the producer gives every pane, used here from the
# other side. NOT a runtime dependency: this client owns a terminal, it never makes one.
portable-pty = { workspace = true }
# The gate's observer connection: the assertions the SCREEN cannot make (how big the
# pane's pty is, whether the daemon still counts the client) are asked over the wire.
sprag-rpc = { workspace = true }
# ...and the JSON those queries are spelled in.
serde_json = { workspace = true }
# A daemon OLDER than this build, for the two skew gates. Was a hand-written peer in the
# gate file until R324, one of four copies with three different ideas of what "older"
# means; the crate is DEV-ONLY, so nothing this client ships depends on it.
sprag-peer = { workspace = true }
