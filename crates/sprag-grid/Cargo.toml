[package]
name = "sprag-grid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Projects a sprag-vt Screen into a pinion GridBuffer (DESIGN.md §3)"
publish = false

[dependencies]
sprag-vt = { workspace = true }
pinion-core = { workspace = true }
# `ProjectionToken` crosses the wire between the host's pane list and a display
# client's fetch gate, so it is one serde-able type here rather than two hand-kept
# spellings at the two ends.
serde = { workspace = true, features = ["derive"] }
