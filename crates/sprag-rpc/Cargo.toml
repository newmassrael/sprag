[package]
name = "sprag-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "sprag's RPC transport policy: a fixed-path, always-on Unix-socket endpoint over pinion's PR-47 RpcIngress seam, with SIGUSR1/2 runtime control. Frontend-agnostic (GUI + headless host share it); GPU-free (seam-only deps)."
publish = false

[dependencies]
# Where a scratch file may go, asked once. `resolve_socket_path`'s last fallback puts the
# socket under the temporary directory, and `std::env::temp_dir()` answers a RELATIVE path
# when TMPDIR is set-and-empty — the endpoint would then be created in whatever directory
# the process was launched from, where no client looks for it (register item 794).
sprag-scratch = { workspace = true }
# WHICH CODE THIS IMAGE WAS BUILT FROM — register item 1066. `BUILD` was computed by this crate's
# own `build.rs` until 2026-09-12, and re-exported below rather than recomputed: the fact is the
# image's and not the wire's, and leaving it here left the substrate — which links no wire — unable
# to say which build composed a sentence a person acts on. No dependencies of its own.
sprag-stamp = { workspace = true }
# The winit-free transport seam (RpcIngress) + the reusable Unix-socket
# adapter (UnixSocketTransport / TransportControl). Both depend only on the
# seam, so this policy crate stays GPU-free and both frontends reuse it.
pinion-rpc = { workspace = true }
pinion-rpc-transport = { workspace = true }
# SIGUSR1(enable)/SIGUSR2(disable) runtime control thread.
signal-hook = { workspace = true }
# Leveled endpoint diagnostics (target "sprag_rpc").
tracing = { workspace = true }
# The client half (HostConn): JSON-RPC request framing over the socket, and the published-grammar
# shapes' own answer rendering (`grammar`).
serde_json = { workspace = true }
# `closed_set!` + `wire_words!`, for the one closed set this crate owns: a call form's SHAPE. The
# lowest crate in the workspace, so this adds no edge anything else has to reason about.
sprag-vt = { workspace = true }
