[package]
name = "sprag-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Plugin extension API (PaneAccess) + SCE-statechart Driver + bundled control plugins (orchestrator, pipe)"
publish = false

[dependencies]
# Producer/control layer: read a pane's screen + inject encoded input. Pinion-free.
sprag-terminal = { workspace = true }
sprag-vt = { workspace = true }
sprag-input = { workspace = true }
# The agent-state VOCABULARY, so the extension API speaks the words a client already reads
# (`AgentState`, and the `Question` a blocked pane is blocked on) rather than re-spelling them at
# one more boundary. Pure — no lock, no wire, no clock — so depending on it costs the substrate
# nothing it did not already have.
sprag-detect = { workspace = true }
# ⛔⛔⛔⛔⛔ WHICH CODE THIS DRIVER WAS BUILT FROM — register item 1066, and the one crate this
# substrate may link to learn it. The driver composes sentences a person reads and acts on
# (`unverified`'s reason is this loop's own words about a checker that said nothing), and until this
# edge existed those sentences could not name the build that wrote them: measured 2026-09-12, a
# seven-day-old daemon's sentence was read as today's and separating the two cost a process audit
# and four string searches.
#
# ⚠⚠ IT IS NOT `sprag-rpc`, WHICH IS WHERE THE STAMP USED TO LIVE. That crate carries pinion and
# serde, and this one is pinion-free and serde-free by charter — so the stamp moved DOWN to a crate
# with no dependencies at all rather than this crate reaching UP through a wire it does not speak.
# ⚠ And not a second `build.rs` here either: one fact, one author (see that crate's `build.rs`).
sprag-stamp = { workspace = true }
# The generated state machine's runtime (Engine + StatePolicy).
sce-rust-runtime = { workspace = true }
# Parse a foreign AI tool's structured stdout (a `claude -p --output-format
# json` envelope) — perception of an external program, NOT serialization of
# sprag's own types (the host still owns the RPC-wire mapping), so this does
# not breach the substrate's serde-free contract. Value-walked, no derives.
serde_json = { workspace = true }
# ⛔⛔⛔⛔⛔ THE ENGINE'S OWN ECMASCRIPT -> LUA TRANSLATOR, AT RUN TIME — register item 1034, and it
# is here rather than in `[build-dependencies]` alone because a kind document in a CONSUMING
# repository's tree is read when a run starts, not when sprag is built.
#
# ⚠⚠⚠⚠⚠ WHAT THE ALTERNATIVE WAS, measured rather than assumed. A `<data>` expression is
# ECMAScript and this datamodel is Lua, and the compiled kinds only work because codegen lowers
# them: read out of `OUT_DIR/debt_loop_sm.rs`, `['.git/logs/HEAD', …]` is emitted as Lua
# `{".git/logs/HEAD", …}`. A document read at run time gets no such pass, so the only two roads are
# to call `sce_build::ecmascript::to_lua_value` — upstream's own, public, and the same one the
# generated code went through — or to write a SECOND ECMAScript-to-Lua translator here. The second
# is a reimplementation of another project's semantics and this workspace's standing answer to that
# shape is no.
#
# ⚠⚠ THE COST, STATED RATHER THAN HIDDEN: this puts a build-time crate into the shipped binary. It
# is the same pinned rev already compiled for this crate's own `build.rs`, so it costs no build
# time — what it costs is size and surface, and the trade is against owning a translator whose
# correctness is upstream's to maintain.
sce-build = { workspace = true }

[dev-dependencies]
# The script engine `ai_loop.scxml`'s datamodel is generated against. STILL a DEV dependency, and
# the reason changed at R381: it was deferring a decision, and now it is a design.
#
# `OuterLoop` and `AiLoop` take their `IScriptEngine` as a parameter, so nothing in this crate names
# a concrete engine and a consumer chooses one — `sprag-host` builds a `LuaEngine` per run, and its
# manifest carries that argument. Keeping this dev-only is what holds that seam open: a second
# engine, or a host that wants none, changes one line in ITS manifest and none here.
#
# ⚠ It is also what the gates enter through. Three of the driver's refusals are only reachable by
# handing in an engine that answers differently about one variable, which is a fixture this crate
# can only build because the engine is a parameter.
sce-rust-lua = { workspace = true }
# ⛔ REGISTER ITEM 794's harness half — a gate, not a convenience. `std::env::temp_dir()` answers a
# RELATIVE path when `TMPDIR` is set-and-empty, and nothing downstream refuses one: under that
# environment a fixture's scratch file lands in the crate's own directory inside this repository
# (measured 2026-08-31: 131 untracked entries, 414 tests failed). `scratch_root()` asserts
# `is_absolute` where the root is taken and panics naming the variable instead.
sprag-scratch = { workspace = true }
# ⛔⛔⛔ WHO DERIVES THE TEMPLATE'S CLAIMS — register item 1035. `LoopKind::CLAIMED` is a table in
# Rust of the `<data>` `ai_loop.scxml` says are a KIND's to author, and the template publishes that
# list in its own comments. A second parser of the claim sentence living HERE is exactly the drift
# the pin exists to notice, so the derivation stays where it already is
# (`sprag_gate::authored::claims`) and this crate's gate calls it.
#
# ⚠ DEV-ONLY, and it takes no dependencies of its own — the same line `sprag-terminal`, `sprag-tui`,
# `sprag-mcp` and `sprag-host` already carry. ⚠⚠ The document is reached by `include_str!` rather
# than by a walk of the tree: a test that read the file at RUN time would be one an unrelated
# crate's commit can turn red (register item 784's population), and the compiler already tracks this
# edge exactly.
sprag-gate = { workspace = true }
# ⚠⚠⚠⚠⚠ THE COMPILER OF `ai_loop.scxml`, AS A DEV DEPENDENCY TOO — register item 547.
#
# It is already this crate's BUILD dependency (above), and a build dependency cannot be driven by a
# test: `build.rs` runs it once and a gate about WHEN it refuses has nothing to hold. The refusal
# under test is `scxml_exhaustiveness::validate`'s, and it fires on a precondition an unrelated edit
# can flip — so a round editing the loop's document can be refused for events it never touched.
#
# ⚠ Naming it twice costs nothing to build: the same pinned rev, already compiled for this crate.
sce-build = { workspace = true }

[build-dependencies]
# Build-time codegen: orchestration.scxml -> OUT_DIR/orchestration_sm.rs.
sce-build = { workspace = true }
