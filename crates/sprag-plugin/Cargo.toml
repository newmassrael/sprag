[package]
name = "sprag-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Plugin extension API (PaneAccess) + SCE-statechart Driver + bundled control plugins (orchestrator, pipe)"
publish = false

[dependencies]
# Producer/control layer: read a pane's screen + inject encoded input. Pinion-free.
sprag-terminal = { workspace = true }
sprag-vt = { workspace = true }
sprag-input = { workspace = true }
# The agent-state VOCABULARY, so the extension API speaks the words a client already reads
# (`AgentState`, and the `Question` a blocked pane is blocked on) rather than re-spelling them at
# one more boundary. Pure — no lock, no wire, no clock — so depending on it costs the substrate
# nothing it did not already have.
sprag-detect = { workspace = true }
# The generated state machine's runtime (Engine + StatePolicy).
sce-rust-runtime = { workspace = true }
# Parse a foreign AI tool's structured stdout (a `claude -p --output-format
# json` envelope) — perception of an external program, NOT serialization of
# sprag's own types (the host still owns the RPC-wire mapping), so this does
# not breach the substrate's serde-free contract. Value-walked, no derives.
serde_json = { workspace = true }

[dev-dependencies]
# The script engine `ai_loop.scxml`'s datamodel is generated against. STILL a DEV dependency, and
# the reason changed at R381: it was deferring a decision, and now it is a design.
#
# `OuterLoop` and `AiLoop` take their `IScriptEngine` as a parameter, so nothing in this crate names
# a concrete engine and a consumer chooses one — `sprag-host` builds a `LuaEngine` per run, and its
# manifest carries that argument. Keeping this dev-only is what holds that seam open: a second
# engine, or a host that wants none, changes one line in ITS manifest and none here.
#
# ⚠ It is also what the gates enter through. Three of the driver's refusals are only reachable by
# handing in an engine that answers differently about one variable, which is a fixture this crate
# can only build because the engine is a parameter.
sce-rust-lua = { workspace = true }
# ⚠⚠⚠⚠⚠ THE COMPILER OF `ai_loop.scxml`, AS A DEV DEPENDENCY TOO — register item 547.
#
# It is already this crate's BUILD dependency (above), and a build dependency cannot be driven by a
# test: `build.rs` runs it once and a gate about WHEN it refuses has nothing to hold. The refusal
# under test is `scxml_exhaustiveness::validate`'s, and it fires on a precondition an unrelated edit
# can flip — so a round editing the loop's document can be refused for events it never touched.
#
# ⚠ Naming it twice costs nothing to build: the same pinned rev, already compiled for this crate.
sce-build = { workspace = true }

[build-dependencies]
# Build-time codegen: orchestration.scxml -> OUT_DIR/orchestration_sm.rs.
sce-build = { workspace = true }
