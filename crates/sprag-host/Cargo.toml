[package]
name = "sprag-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless host: assembles the producer screen into a pinion Scene::TextGrid and serves it as scene-as-data over JSON-RPC (DESIGN.md §1/§3)"
publish = false

[dependencies]
# Producer (PTY session) + projection (screen -> GridBuffer); the host adds
# the scene assembly + RPC server on top.
sprag-vt = { workspace = true }
sprag-grid = { workspace = true }
sprag-terminal = { workspace = true }
# Agent-state detection (H3): a PURE read of a screen + title, consumed HERE for the same
# reason `sprag-grid` is — the producer owns the emulator and the PTY, and everything that
# turns a screen into a scene fact lives on this side of that line. The per-pane memory
# (`Tracker`) is held in `agent.rs` rather than on a pane, because a `WorkspaceExternal` is
# rebuilt per request and a pane belongs to the producer.
sprag-detect = { workspace = true }
# A user's `[[agent]]` manifests carry regex tests (crate::config), and a pattern is
# compiled where it is READ so a manifest that cannot compile is refused with the file
# named, rather than silently never matching on every pane forever. `sprag-detect` holds
# the compiled `Regex` in its public `Test`, so this is that type's own crate rather than
# a second regex engine in the tree.
regex = { workspace = true }
# Key→PTY-byte encoder: the engine External (pane.rs) invokes it to turn an
# injected W3C key into the bytes the child reads (PINION-REQUIREMENTS R2.6).
sprag-input = { workspace = true }
# The plugin substrate (PaneAccess + Driver + bundled plugins): the plugin-host
# External (plugins.rs) runs plugins over it on background threads.
sprag-plugin = { workspace = true }
# ⚠⚠⚠ THE SCRIPT ENGINE `ai_loop.scxml`'s DATAMODEL IS EVALUATED BY — a REAL dependency since R381,
# and that promotion is the decision the register had been holding open since R378.
#
# It was DEV-only on purpose while nothing in the product constructed the outer loop: `OuterLoop`
# takes its `IScriptEngine` as a parameter precisely so the daemon would not link mlua and the C
# Lua toolchain it builds through, for a machine no surface started.
#
# `run {plugin: "ai_loop"}` is that surface, so the daemon is now the construction site and the
# cost is real: one Lua interpreter, linked into every sprag daemon, whether or not anybody starts
# a loop. It is paid because the alternative is a loop that runs end to end against a live agent
# and has no door — which is what every round from R376 to R380 measured and none of them could
# fix. ⚠ The parameter STAYS: it is what lets a gate hand in a witness engine, so the same decision
# that kept this dependency out is the one that makes the driver's refusals testable.
sce-rust-lua = { workspace = true }
# `Arc<dyn IScriptEngine>` — the type the line above is handed in as. Reached through the runtime
# rather than through `sce-rust-lua`'s own re-export so the host names the INTERFACE it depends on
# and the implementation separately, which is what would let a second engine be substituted.
sce-rust-runtime = { workspace = true }
# Base64 for the inline-image (Kitty graphics / Sixel, R1404) RGBA served ON DEMAND via the
# `image_data.<id>` pane slot (the panes slot carries only the {id,w,h,anchor,seq} summary).
base64 = { workspace = true }
pinion-core = { workspace = true }
# The RPC dispatch + scene/snapshot wire. Its heavy transitive deps are
# confined to this host crate, never the producer/projection (DESIGN.md §5).
pinion-rpc = { workspace = true }
# The always-on Unix-socket transport policy (shared with the GUI): the
# headless server binary mounts it with a channel-funnel RpcIngress. GPU-free.
sprag-rpc = { workspace = true }
# SIGINT/SIGTERM graceful shutdown in the server binary (cancel+join runs).
signal-hook = { workspace = true }
# `--daemon` self-daemonize (fork/setsid), stdio redirect, and the single-instance
# advisory flock in the server binary; and the `sprag` CLI's `setsid` before `exec`, so the
# window `attach` launches outlives the terminal that ran it. Unix-only, matching the host.
libc = { workspace = true }
# Production logging facade (level/target control). The library emits events; the
# frontend (GUI) and now the `sprag-term` daemon install the subscriber.
tracing = { workspace = true }
# The daemon's subscriber (env-filtered by SPRAG_LOG). The library stays
# subscriber-free — only the `sprag-term` binary installs one, so the durability
# ring's restore/save events reach the daemon's log.
tracing-subscriber = { workspace = true }
# Building the read-only method-gate error response.
serde_json = { workspace = true }
# Parse `.sprag.toml`, the per-project command file (crate::project). Only the host reads
# it: the host is the one process that knows every pane's live cwd, so one parse serves the
# CLI, every attached GUI and the MCP surface alike.
toml = { workspace = true }
# Edit the user's `config.toml` in place for `sprag bind-key` / `unbind-key` (crate::config). The
# read path above deserializes into a struct, which is a one-way trip: it cannot put a binding back
# without discarding every comment the user wrote around it.
toml_edit = { workspace = true }
# serde derive for the wire DTOs (PaneScrollFacts + the pane cells-frame). The
# GridBuffer's own serde comes from pinion-core; this is for sprag's frame types.
serde = { workspace = true }
# The prompt's line editor (crate::prompt) moves and deletes by GRAPHEME CLUSTER, not by
# codepoint: a Backspace over a composed Hangul syllable or an emoji ZWJ sequence has to take the
# whole thing. Already in this tree for the emulator's own clustering (sprag-vt), so this is the
# same answer to the same question one layer up rather than a new dependency. It stops at the
# cluster: how WIDE one is on screen is the surface's question, not the buffer's, so the editor
# reports a byte offset and each frontend measures with its own painter's width function.
unicode-segmentation = { workspace = true }

# The daemon's ONE D-Bus call, at startup: ask the systemd user manager for a delegated cgroup
# subtree so `sprag_terminal::share::Tree` has somewhere to build (crate::delegation, R336).
#
# Linux-gated rather than optional behind a feature: cgroups are the whole reason it is here, so
# every other platform wants it absent rather than switchable. A host with no systemd still builds
# and still runs — it gets an `Unenforceable` answer with its reason, which is the designed outcome
# rather than a degraded one.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
# The published-grammar claims, written once for every surface that publishes one (see the crate).
# A dev-dependency CYCLE: it depends on this crate for the types. Cargo permits exactly this shape.
sprag-conformance = { workspace = true }
# A daemon OLDER than this build: the two skew sweeps drive one that serves no address and one
# that knows no action. Four test files had each written their own until R324; this is DEV-ONLY.
sprag-peer = { workspace = true }
# The real-socket wire tests build/decode base64 image payloads (R1404 Stage 5 on-demand).
base64 = { workspace = true }
# The durability e2e SIGKILLs the forked daemon (the reboot analogue). An integration test links
# the crate's dev-dependencies, not its own, so libc is declared again here.
libc = { workspace = true }
