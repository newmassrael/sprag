[package]
name = "sprag-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless host: assembles the producer screen into a pinion Scene::TextGrid and serves it as scene-as-data over JSON-RPC (DESIGN.md §1/§3)"
publish = false

[dependencies]
# Producer (PTY session) + projection (screen -> GridBuffer); the host adds
# the scene assembly + RPC server on top.
sprag-vt = { workspace = true }
sprag-grid = { workspace = true }
sprag-terminal = { workspace = true }
# Key→PTY-byte encoder: the engine External (pane.rs) invokes it to turn an
# injected W3C key into the bytes the child reads (PINION-REQUIREMENTS R2.6).
sprag-input = { workspace = true }
# The plugin substrate (PaneAccess + Driver + bundled plugins): the plugin-host
# External (plugins.rs) runs plugins over it on background threads.
sprag-plugin = { workspace = true }
# Base64 for the inline-image (Kitty graphics / Sixel, R1404) RGBA served ON DEMAND via the
# `image_data.<id>` pane slot (the panes slot carries only the {id,w,h,anchor,seq} summary).
base64 = { workspace = true }
pinion-core = { workspace = true }
# The RPC dispatch + scene/snapshot wire. Its heavy transitive deps are
# confined to this host crate, never the producer/projection (DESIGN.md §5).
pinion-rpc = { workspace = true }
# The always-on Unix-socket transport policy (shared with the GUI): the
# headless server binary mounts it with a channel-funnel RpcIngress. GPU-free.
sprag-rpc = { workspace = true }
# SIGINT/SIGTERM graceful shutdown in the server binary (cancel+join runs).
signal-hook = { workspace = true }
# `--daemon` self-daemonize (fork/setsid), stdio redirect, and the single-instance
# advisory flock in the server binary. Unix-only, matching the rest of the host.
libc = { workspace = true }
# Production logging facade (level/target control). The library emits events; the
# frontend (GUI) and now the `sprag-term` daemon install the subscriber.
tracing = { workspace = true }
# The daemon's subscriber (env-filtered by SPRAG_LOG). The library stays
# subscriber-free — only the `sprag-term` binary installs one, so the durability
# ring's restore/save events reach the daemon's log.
tracing-subscriber = { workspace = true }
# Building the read-only method-gate error response.
serde_json = { workspace = true }
# Parse `.sprag.toml`, the per-project command file (crate::project). Only the host reads
# it: the host is the one process that knows every pane's live cwd, so one parse serves the
# CLI, every attached GUI and the MCP surface alike.
toml = { workspace = true }
# serde derive for the wire DTOs (PaneScrollFacts + the pane cells-frame). The
# GridBuffer's own serde comes from pinion-core; this is for sprag's frame types.
serde = { workspace = true }

[dev-dependencies]
# The real-socket wire tests build/decode base64 image payloads (R1404 Stage 5 on-demand).
base64 = { workspace = true }
# The durability e2e SIGKILLs the forked daemon (the reboot analogue). An integration test links
# the crate's dev-dependencies, not its own, so libc is declared again here.
libc = { workspace = true }
