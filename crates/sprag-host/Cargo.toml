[package]
name = "sprag-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless host: assembles the producer screen into a pinion Scene::TextGrid and serves it as scene-as-data over JSON-RPC (DESIGN.md §1/§3)"
publish = false

[dependencies]
# Producer (PTY session) + projection (screen -> GridBuffer); the host adds
# the scene assembly + RPC server on top.
sprag-vt = { workspace = true }
sprag-grid = { workspace = true }
sprag-terminal = { workspace = true }
# Key→PTY-byte encoder: the engine External (pane.rs) invokes it to turn an
# injected W3C key into the bytes the child reads (PINION-REQUIREMENTS R2.6).
sprag-input = { workspace = true }
# The plugin substrate (PaneAccess + Driver + bundled plugins): the plugin-host
# External (plugins.rs) runs plugins over it on background threads.
sprag-plugin = { workspace = true }
pinion-core = { workspace = true }
# The RPC dispatch + scene/snapshot wire. Its heavy transitive deps are
# confined to this host crate, never the producer/projection (DESIGN.md §5).
pinion-rpc = { workspace = true }
# The always-on Unix-socket transport policy (shared with the GUI): the
# headless server binary mounts it with a channel-funnel RpcIngress. GPU-free.
sprag-rpc = { workspace = true }
# SIGINT/SIGTERM graceful shutdown in the server binary (cancel+join runs).
signal-hook = { workspace = true }
# Production logging facade (level/target control). The library emits events; the
# frontend (GUI, or a future sprag-term subscriber) installs the subscriber.
tracing = { workspace = true }
# Building the read-only method-gate error response.
serde_json = { workspace = true }
