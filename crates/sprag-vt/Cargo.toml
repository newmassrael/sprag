[package]
name = "sprag-vt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VtPort + termwiz-based terminal emulator owning screen state (sprag DESIGN.md §4)"
publish = false

[dependencies]
# termwiz: embedded verified escape parser + cell/color primitives.
# The emulator state machine on top is sprag-owned (DESIGN.md §4).
termwiz = { workspace = true }
# Cell display width (UAX#11) for wide-cluster (CJK) head/trailer.
unicode-width = { workspace = true }
# Inline SSO string for `Cell.cluster`: no heap alloc on the print path for the
# common single-char cluster, O(1) clone for scroll / scrollback / reflow.
smol_str = { workspace = true }
# Base64 decode of Kitty graphics `Direct` image payloads (pinion R1404, Stage 1).
base64 = { workspace = true }
# PNG decode for the Kitty graphics `f=100` format (pinion R1404, Stage 4).
png = { workspace = true }
