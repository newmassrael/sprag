[workspace]
# Greenfield project — atomic-first design. The atomic store
# (docs/.atomic/workspace.atomic.json) is the sole directly-validated SSOT
# (Mnemosyne store-direct model, mirroring pinion). Authoring happens through
# the Mnemosyne MCP typed primitives (add-section, set-section-*) + the
# `append-changelog-entry` CLI; humans read the store via `mnemosyne-cli query`.

[schema]
changelog_titles = ["Changelog"]
# Empty prefix = append-gate disabled (greenfield: no entry-id convention
# locked yet — mirrors pinion's open-prefix choice so `R<N>` and `Round N`
# both append cleanly). Tighten to a concrete prefix once a convention sticks.
entry_id_prefix = ""

[style]
locale = "en"

# Audit row for a publishable/atomic divergence (mnemosyne-cli
# emit-publishable-override-ledger-draft). Round 24's atomic decision_summary
# was a placeholder written by a CLI flag-probe slip; the frozen ledger is
# append-only, so the publishable view corrects it here (atomic
# changes/verification/impact are correct and unchanged).
[[publishable_override_ledger]]
kind = "correction"
target_id = "Round 24"
fields = ["publishable_decision_summary", "publishable_carry_forward_bullets"]
reason = "Atomic decision_summary was a placeholder 'x' written by a CLI flag-probe slip during the Round 24 append; the publishable view restores the intended headline and adds the carry-forward bullets. Atomic changes/verification/impact bullets are correct and unchanged."
applied_in = "Round 24"
content_hash_before = "cac3fc8a279c08df99a50cde4a74171568f0009848655e484aadd3a5cd34486c"
content_hash_after = "cabcc4e62a9c22dd324b65543d505cd78a9a96a73b536d42e71bcf0ad02974e1"
