[workspace]
# Greenfield project — atomic-first design. The atomic store
# (docs/.atomic/workspace.atomic.json) is the sole directly-validated SSOT
# (Mnemosyne store-direct model, mirroring pinion). Authoring happens through
# the Mnemosyne MCP typed primitives (add-section, set-section-*) + the
# `append-changelog-entry` CLI; humans read the store via `mnemosyne-cli query`.

[schema]
changelog_titles = ["Changelog"]
# Empty prefix = append-gate disabled (greenfield: no entry-id convention
# locked yet — mirrors pinion's open-prefix choice so `R<N>` and `Round N`
# both append cleanly). Tighten to a concrete prefix once a convention sticks.
entry_id_prefix = ""

[style]
locale = "en"

# Mnemosyne Round 783 scan-coverage gate: every `.rs` in the workspace must be
# either scanned by `paths` or declared in `scan_exclusions`, so a tree that is
# simply missing is loud and only a tree someone wrote down is quiet.
#
# sprag scans ALL of it. Every Rust file lives under `crates/` (workspace
# members, their `build.rs`, their `tests/`), so one path covers the tree and
# there is nothing to exclude — sprag vendors no submodule, and a source whose
# comments cite this workspace's own sections is exactly what the gate is for.
[plugins.set_equality_validator]
paths = ["crates/"]
comment_only = true
scan_exclusions = []
# Severities are STATED, not inherited, so this file records sprag's stance
# rather than whatever the CLI defaults to next.
#
# `reject` for the hallucination class, which the tree is at zero of. It first
# measured 22, and what they turned out to be is the reason the prefixes below
# exist: NOT ONE was a dead citation. Twenty named real pinion sections (§5.39
# focus model, §6.3 async model, §5.15/§5.16, §5.2, §5.23, §5.45, §5.49,
# §5.51) and two were the matcher reading `§1/§3` as an id called `§1/`. The
# gate was right to flag them anyway: sprag's own sections are the flat §1-§5,
# so a bare `§6.3` in sprag source pointed at a section this workspace does
# not have and never would — the citation was true and unreadable at once.
severity_missing = "reject"
severity_binding = "info"
# Every cross-workspace citation now names its workspace immediately before
# the `§`, which is the form the bare matcher resolves AND the form a reader
# needs: `pinion §5.39 (R1020)`, not `pinion R1020 §5.39` (the numeric form
# does not match an `R<n>` doc-number — measured, 0 of 22 cleared by config
# alone). Round provenance moves after the section rather than being dropped.
external_section_prefixes = ["pinion"]
external_section_prefixes_bare = ["pinion"]

# Audit row for a publishable/atomic divergence (mnemosyne-cli
# emit-publishable-override-ledger-draft). Round 24's atomic decision_summary
# was a placeholder written by a CLI flag-probe slip; the frozen ledger is
# append-only, so the publishable view corrects it here (atomic
# changes/verification/impact are correct and unchanged).
[[publishable_override_ledger]]
kind = "correction"
target_id = "Round 24"
fields = ["publishable_decision_summary", "publishable_carry_forward_bullets"]
reason = "Atomic decision_summary was a placeholder 'x' written by a CLI flag-probe slip during the Round 24 append; the publishable view restores the intended headline and adds the carry-forward bullets. Atomic changes/verification/impact bullets are correct and unchanged."
applied_in = "Round 24"
content_hash_before = "cac3fc8a279c08df99a50cde4a74171568f0009848655e484aadd3a5cd34486c"
content_hash_after = "cabcc4e62a9c22dd324b65543d505cd78a9a96a73b536d42e71bcf0ad02974e1"

# R281's atomic `impact_refs` named §39 and §41 — section ids this workspace has
# never had (it has §1–§5). They were written in pinion's `§5.41` idiom without the
# citation check this project already requires for a `Round N`, and the frozen
# ledger cannot be rewritten, so the dangling refs are registered here and the
# publishable view carries the sections the round actually touched (§3 the pinion
# consumer contract, §5 delivery status + risk register).
[[orphan_ledger]]
kind = "atomic_entry_ref"
doc = "<atomic-changelog>"
from = "R281"
to = "39"
reason = "R281 impact_refs citation slip: no §39 exists in this workspace (§1-§5); publishable impact_refs corrected to §3,§5"
since = "R281"

[[orphan_ledger]]
kind = "atomic_entry_ref"
doc = "<atomic-changelog>"
from = "R281"
to = "41"
reason = "R281 impact_refs citation slip: no §41 exists in this workspace (§1-§5); publishable impact_refs corrected to §3,§5"
since = "R281"

# Audit row for R281's impact_refs correction (see the orphan_ledger rows above).
[[publishable_override_ledger]]
kind = "redaction"
target_id = "R281"
fields = ["publishable_impact_refs"]
reason = "R281's atomic impact_refs named 39 and 41, section ids this workspace has never had (it has 1-5) - written in pinion's section idiom without the citation check this project already requires for a Round N. The frozen ledger cannot be rewritten, so the publishable view carries the sections the round actually touched and the dangling atomic refs are registered in orphan_ledger."
applied_in = "R281"
content_hash_before = "b378b0527bcac6e7d44891dd0c425ca4c29845a032b2deb5b54519e8939fcb1f"
content_hash_after = "539a776d4d4707ac08912cd47f905be1e0d8791d2d0682288ea4ab42f9abe93f"

# Audit row for R296's verification correction. The atomic half was appended after
# five commits; the audit pass over the finished tree that follows every round then
# found a defect, fixed it, and moved the counts.
[[publishable_override_ledger]]
kind = "redaction"
target_id = "R296"
fields = ["publishable_verification_bullets"]
reason = "R296's atomic verification bullets were written after five commits and record 'exit 0 / 45 / 1923 passed' and 'all 5 commits'. The audit pass over the finished tree that this project requires ran AFTER the append, found the round violating its own one-semantics thesis, fixed it, and added a seventh commit plus one more test - so the frozen numbers became 1924 and 7. The audit half cannot be rewritten, so the publishable view carries the true final counts, says plainly that it is a correction, and records the two tests that passed their first revert-proof while being vacuous."
applied_in = "R296"
content_hash_before = "deb55476c512eca59782a2d7b41722d6b27e170ce6445d9287acb2a792d2de39"
content_hash_after = "c0e5123651b08344d031df849adeff12c6d767fc3529c567f3a987eefc50f839"

[[publishable_override_ledger]]
kind = "carry_forward"
target_id = "R308"
fields = ["publishable_carry_forward_bullets"]
reason = "The audit carry-forward was written before the owner's debt question, which found TWO MORE — a LIVE DEFECT this round shipped (a pointer reaching a divider under the full-screen key table: the keystroke path was closed and the mouse was not, which is R306's paste leak one input class over) and a mechanism claim in a durable comment that was FALSE and had been copied from crate::prompt's scrim, wrong the same way since R306. Both FIXED in 1adeb45, both driven or corrected in place. The publishable half carries them; the audit half is left exactly as it was written, which is the honest record of what the round knew at the moment it reconciled."
applied_in = "R308"
content_hash_before = "b6d7d0e0b1cdd755b3b18f3866b044cb234bfe66eed2ca923c78b677f1ee2f9f"
content_hash_after = "0a47c670d74de26dc76989a037c759cf957d0f98f28024186f6f9ce10ba04eae"
