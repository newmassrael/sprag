# What sprag needs from a build machine — REQUIREMENTS, never a machine name.
#
# The `remote-build` skill picks the machine from `~/.claude/remote-build/hosts.toml` at run time
# and asks it what it has. Naming a machine here would go stale the day another one arrives, and a
# stale list reads exactly like a correct one.
#
# ⚠⚠ THE REMOTE TREE IS A READ-ONLY VERIFICATION COPY. Commits, ledger writes and pushes happen
# locally; anything edited over there is erased by the next rsync.

# Tracked files only. sprag keeps `claudedocs/` gitignored and it holds UPSTREAM REQUIREMENT drafts
# (PR-9 as of R362) that are nobody else's business — `all` would ship them to another machine
# without anyone deciding to.
send = "tracked"

# ⚠⚠ `target` IS A SYMLINK HERE (`target -> ~/.buildcache/sprag`), so rsync would plant a BROKEN
# link on the remote and cargo would build through it into nowhere. Excluded by path, not by luck.
# `sweep.timestamp` is `cargo sweep --stamp`'s transient marker; it is consumed by `--file`, but a
# run interrupted between the two leaves one behind and it must not travel.
exclude = ["/target", "/sweep.timestamp"]

# The executables the commands below actually invoke. `mnemosyne-cli` is deliberately NOT here: it
# is a COMMIT-time gate (`.githooks/pre-commit`), and committing is local by rule.
needs = ["cargo", "cargo-clippy", "rustdoc"]

# Measured against `.github/workflows/ci.yml`'s own `System packages` step for the headless Linux
# job. macOS needs none of it — `fontique` uses Core Text there and links no fontconfig at all.
#
# ⚠ The PIXEL smoke needs more (`xvfb`, `mesa-vulkan-drivers`, `libvulkan1`, `libxkbcommon-x11-0`,
# `libxcursor1`, `libxi6`) and is NOT part of `verify` below: it drives a real GPU surface, and a
# machine that has to be asked for a GPU is a different question from one that has to be asked for
# cores. Add them here on the day the pixel smoke is what gets sent.
packages = ["libfontconfig-dev"]

# A full sprag build compiles the pinion crates too, so this is not a small workspace.
min_ram_gb = 16
min_free_gb = 20

# What ONE task of this repository peaks at. bx divides a host's free RAM by this to get the
# parallelism budget, so it is the RAM half of a formula that ran on cores alone until 2026-08-20.
#
# ⚠⚠ IT IS A MEASUREMENT AND IT IS DERIVED, NOT TYPED. `[peak_measured]` at the foot of this file
# holds the readings; the gate `a_fleet_ceiling_is_a_measurement_with_a_date` recomputes this
# integer from them and refuses a value that does not follow. BOTH directions of wrong are real:
# too LOW packs a host past its RAM — the swap storm of 2026-08-19, load 29 with 82% of the CPU
# idle — and too HIGH divides free RAM by a number nobody measured and refuses hosts that could
# have done the work, which is the failure that wears the face of caution.
#
# ⚠ Whole GiB because bx parses this field with an INTEGER regex: a `2.5` here would be read as
# `2` silently, so the file would declare one ceiling and the fleet would use another.
peak_gb_per_task = 2

# ⛔⛔⛔⛔⛔ WHAT THIS REPOSITORY HANDS THE WRAPPER ITSELF — register item 932, and the population
# `[commands]` was never the whole of.
#
# `[commands]` is what this DECLARATION sends. It is not what the wrapper RUNS. The wrapper divides
# a host's free RAM by `peak_gb_per_task` for whatever argv it was given, and it never reads
# `[commands]` or `[peak_measured]` at all. ⚠ Asked of the program rather than remembered:
# `grep -n 'commands' bin/bx` answers FOUR lines — three comments and one refusal message
# (`die "unknown flag $1 (commands go after --)"`), and not one of them is a read of the table.
# `grep -n 'peak_measured\|_kb' bin/bx` answers none at all. So the ceiling derived from two rows
# below has been budgeting every command any caller hands it.
#
# ⛔⛔ **THE SENTENCE ABOVE USED TO SAY «THE WRAPPER READS EXACTLY ONE KEY FROM THIS FILE», AND
# RE-MEASURING IT ON 2026-09-10 REFUTED THAT** — register item 1009, and the wrapper has not been
# edited since 2026-08-24, so it was wrong when it was written rather than gone stale. Asked of the
# program, which answers this question about itself:
#
#     bx --explain-declaration     # every extractor, INCLUDING the ones that found nothing
#
# Ten keys, six of them filled here: `send`, `needs`, `packages`, `writes`, `pin_host`,
# `peak_gb_per_task`, `min_ram_gb`, `min_free_gb`, `target_cap_gb`, `workspace_dir`. The true half
# of the old sentence is that exactly one of them BUDGETS; the false half mattered, because a
# repository reading it would conclude that a requirement written here is a requirement nobody
# reads.
#
# ⇒ ⚠⚠ AND THE ANSWER CARRIES ITEM 1009's OWN LIMIT: **not one of those ten is a platform.** So a
# `platform = "…"` host requirement written here would be a key the wrapper does not extract, and
# `--explain-declaration` is where that shows. The half of 1009 this repository can pay is at its
# OWN call sites — `.githooks/rust-gates.sh` now reads `precommit_platform` beside `precommit_kb`
# and refuses to spend another platform's peak — and the fleet half is the wrapper's owner's.
#
# ⚠⚠ MEASURED, AT 2026-09-06, from the wrapper's own logs rather than from memory:
#     ls target/bx-logs/*.log | wc -l                                   -> 10029 runs
#     grep -h '^# cmd:' target/bx-logs/*.log | sort -u | wc -l          ->  2514 distinct commands
#     grep -hc 'peak 2GB/task' target/bx-logs/*.log | paste -sd+ | bc   ->  2600 budgeted by it
# Two rows measured, 2,514 commands budgeted.
#
# ⛔ AND THE SENTENCE THIS FILE USED TO REST ON WAS FALSE. `[peak_measured]` below excludes a 6.5GB
# rustdoc reading because *"that is the COMMIT HOOK's doc gate and is not a command this file
# sends"*. True of the file, false of the fleet: `grep -l 'document-private-items'
# target/bx-logs/*.log | wc -l` answers **767**, and the single most frequent command the wrapper
# has ever been given for this repository is this hook lane — 360 runs. The exclusion was correct
# about which table the command belonged in and wrong about whether anybody was budgeting it.
#
# So it belongs in a table of its own, measured to the same standard — and NOT folded into the
# scalar, which the block under the row below shows arithmetically would make things worse rather
# than better. `every_command_this_repository_hands_the_wrapper_is_one_it_measured` holds that no
# `"${BX}"` call site in `.githooks/` sends a command that is not here AND that the site divides by
# its reading, which is what keeps a row from being a number nobody uses.
[routed]
# `.githooks/pre-commit`'s lint lane, exactly as the hook composes it from `$lint_and_doc` and
# `$ratchets`. ⚠ The inner quotes are SINGLE and that is this table's doing: the gate's reader takes
# TOML basic strings and a `"` inside a value truncates it, so the hook was changed to spell the
# same word in a way both sides can hold. A change to either spelling is now a mismatch somebody
# reads rather than a divergence nobody sees.
precommit = "cargo clippy --workspace --all-targets -- -D warnings && RUSTDOCFLAGS='-D warnings' CARGO_TARGET_DIR=target/doc-gate cargo doc --workspace --no-deps --document-private-items && cargo test -p sprag-gate && cargo test -p sprag-rpc --test pins && cargo test -p sprag-tui --test gpu_free && cargo test -p sprag-client --test gpu_free"

# ⛔⛔⛔⛔⛔ ITS READING LIVES HERE AND NOT IN `[peak_measured]`, AND THE ARITHMETIC IS WHY.
#
# Taken with this repository's own instrument, which is the same one `[peak_measured]` is taken
# with and whose sampler walks the run's ANCESTRY rather than matching a program name — the reason
# that matters is two paragraphs down:
#
#     bash crates/sprag-gate/tests/doubles/declared-verify/measure-peak precommit
#     -> RUN_STATUS=0  PEAK_KB=9260688  PEAK_WORST=rustdoc --crate-type bin --crate-name sprag_gui
#
# **8.83 GiB.** `the_ceiling_is_the_next_whole_gigabyte_above_the_worst_measurement` derives the
# scalar as `floor(worst) + 1`, so folding this into `[peak_measured]` would set
# `peak_gb_per_task = 9` — and `bx:1738` divides free RAM by it for EVERY command. Measured against
# today's host: 22 GB free gives 11 tasks at the declared 2 and **2** at 9. `build`'s own reading is
# 1,204,328 kB, so the row that made this repository honest would run `build` five times less
# parallel than its own measurement allows. That is the "too HIGH" failure this file names beside
# "too LOW" — *refuses hosts that could have done the work* — and it would be self-inflicted.
#
# ⇒ ⭐ **So the scalar's SHAPE is what the measurement refutes.** One number per repository cannot
# describe commands whose peaks differ sevenfold, and raising it is not a fix. This reading is kept
# where it cannot corrupt the scalar, and the command it belongs to is bounded from it AT ITS CALL
# SITE — `.githooks/pre-commit` divides free RAM by this figure and hands the result down, so the
# bound travels with the command whether or not the wrapper is in the chain. The clause
# `every_command_this_repository_hands_the_wrapper_is_one_it_measured` holds that pairing: a routed
# command with no reading here, or a call site that does not bound itself from it, is a red.
#
# ⚠⚠ THE FILTER IS WHY THIS NUMBER CAN BE TRUSTED AND SOME EARLIER ONES CANNOT. `measure-peak`
# selects by walking `PPid` back to the run. A reading taken instead with `ps -eo pid= -C rustdoc`
# selects NOTHING: `-e` means every process and it overrides `-C` — measured 2026-09-06, 772 pids
# against 771 for a bare `ps -e`, while `ps -o pid= -C rustdoc` correctly answered 0. Register item
# 932 carries three readings taken that way and retracted the same day.
precommit_cmd = "cargo clippy --workspace --all-targets -- -D warnings && RUSTDOCFLAGS='-D warnings' CARGO_TARGET_DIR=target/doc-gate cargo doc --workspace --no-deps --document-private-items && cargo test -p sprag-gate && cargo test -p sprag-rpc --test pins && cargo test -p sprag-tui --test gpu_free && cargo test -p sprag-client --test gpu_free"
precommit_kb = 9260688
precommit_date = "2026-09-06"
precommit_host = "the 31GiB workstation, 32 cores, rustc stable, cold CARGO_TARGET_DIR"
precommit_worst = "rustdoc --crate-type bin --crate-name sprag_gui, in the doc leg"
# ⛔⛔ WHICH PLATFORM THE NUMBER CAME FROM — register item 1008, and it is not decoration.
#
# `measure-peak` samples `VmHWM` out of procfs and that interface is Linux's; a host without it can
# produce no reading at all. So a figure here is a claim about ONE platform's memory behaviour, and
# `every_reading_names_a_platform_the_instrument_can_measure_on` checks this field against what the
# instrument answers to `--platforms` rather than against a list kept in the gate.
#
# ⚠ DERIVED, NOT TYPED, and the derivation is short enough to check: this reading exists, the only
# method this instrument has is procfs, and `precommit_host` above names the workstation this
# repository is developed on. The instrument now PRINTS `MEASURED_PLATFORM` beside the number, so
# the next reading is copied rather than derived.
precommit_platform = "Linux"

[commands]
# What the machine has to produce before anything can be judged.
build = "cargo test --workspace --no-run"

# ⚠⚠ THE SAME GATES THIS PROJECT RUNS LOCALLY, in one command so a remote run cannot pass a
# subset. Each is here for a reason the others do not cover:
#
#   1. the workspace suite, minus sprag-gui — the bulk of the evidence;
#   2. sprag-gui SEPARATELY and as `--bins`, because that crate HAS NO LIB TARGET, so `--workspace`
#      alone never builds its 333 gates. The bogus `DBUS_SESSION_BUS_ADDRESS` / `XDG_RUNTIME_DIR`
#      are load-bearing: without cgroup delegation the daemon otherwise tries a real session bus
#      and the gates hang rather than fail;
#   3. clippy over ALL targets, because a lint that only fires in a test is still a lint;
#   4. rustdoc, because a broken intra-doc link is how this workspace's docs rot silently;
#   5. and the coverage of what clauses 1-2 actually reached, which their exit codes cannot say.
#
# ⛔⛔⛔ THE SENTENCE ABOVE WAS FALSE UNTIL 2026-08-23, AND IT SAID SO IN THE OPPOSITE DIRECTION.
# The four clauses were joined by `&&` and none carried `--no-fail-fast`, which is a subset TWICE
# over: `cargo test` stops at its first failing binary (measured on this workspace: 61 suites of
# 80, register item 585), and `&&` withdraws every later clause the moment an earlier one is red —
# so a failing suite silently removed clippy and rustdoc from the run. Both come back as the same
# exit code a full run gives. Register item 620; four gates in
# `crates/sprag-gate/tests/the_declared_verify_cannot_pass_a_subset.rs` hold the repair, and they
# read THIS line rather than a copy of it — one of them RUNS it, with a tracked `cargo` double, so what is
# checked is the control flow rather than a substring of it.
#
# ⚠⚠ `cmd || rc=1` RATHER THAN `&&`, AND `exit $rc` AT THE END. Every clause runs, every failure
# is remembered, and the command still ends red. Plain `;` alone would be the naive repair and a
# worse defect than the original: every clause would run and the shell would report the LAST
# clause's status, so a failing suite would come back 0 — success over a failure rather than over
# silence. The gates named above drive exactly this, with a tracked `cargo` double.
#
# ⚠ THE TEST OUTPUT GOES TO FILES THIS COMMAND CREATES, not to `bx`'s log: bx writes that on the
# LOCAL side while these clauses run on the remote, so the remote has no copy to read. It is
# `cat`ted straight afterwards so the run still streams — the files exist for `sweep-coverage`,
# which needs both legs together to see all fifteen crates (the workspace one excludes the GPU
# crate that the second leg is).
verify = "rc=0 ; cargo test --workspace --exclude sprag-gui --no-fail-fast > /tmp/sprag-verify-1.log 2>&1 || rc=1 ; cat /tmp/sprag-verify-1.log ; DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent/bus XDG_RUNTIME_DIR=/nonexistent cargo test -p sprag-gui --bins --no-fail-fast > /tmp/sprag-verify-2.log 2>&1 || rc=1 ; cat /tmp/sprag-verify-2.log ; cargo clippy --workspace --all-targets || rc=1 ; cargo doc --workspace --no-deps || rc=1 ; cargo run -q -p sprag-gate --bin sweep-coverage -- /tmp/sprag-verify-1.log /tmp/sprag-verify-2.log || rc=1 ; exit $rc"

# ⚠⚠⚠ MEASURED 2026-08-12, FIRST REMOTE RUN — ONE GATE DIVERGES BETWEEN TWO MACHINES AND WHY IS NOT
# KNOWN. `sprag-host --test cli`'s `a_hooks_report_does_not_outlive_an_agent_the_pane_did_not_spawn`
# fails on the BUILD MACHINE and passes on the WORKSTATION, on the same tree: the agent's
# `hook:claude` report is still `working` twenty seconds after the agent was killed.
#
#   * build machine, with that binary's other 112 tests: FAILS;
#   * build machine, run ALONE: passes 3/3;
#   * workstation, full `cargo test --workspace`: passes (2881/0).
#
# ⚠ Bounding `RUST_TEST_THREADS` to 8 did NOT fix it, so "too much test parallelism" is refuted. So
# are the obvious environment guesses: **both machines report 32 cores, `XDG_RUNTIME_DIR`, a running
# `systemd --user`, and the same rustc.** The cause is open.
#
# ⚠ The machines are named in the owner's own notes rather than here, because which hosts exist is
# not this repository's business — but WHICH SIDE a measurement came from is, or the next reader
# cannot tell a machine-specific result from a general one.
#
# Until it is understood, a remote verify of sprag will report this one failure. Do not read it as a
# red in the change under test without checking it against this note — and do not read it as
# harmless either. It is its own round.
#
# ⚠⚠⚠ MEASURED 2026-08-12, SECOND REMOTE RUN — A SECOND DIVERGENT CLASS, in `sprag-plugin --lib`,
# and this one MOVES BETWEEN TESTS. Every instance has the same signature:
#
#     Outcome { state: Exhausted(Duration), iterations: 1, cost: Some(Bytes(0)), ... }
#
# `Bytes(0)` with one iteration means NOTHING WAS EVER INJECTED: the readiness barrier consumed the
# fixture's whole `max_duration` (30 s) and the run ended on the clock. Seen so far:
#
#   * `a_reply_that_opens_by_quoting_the_question_keeps_that_line`
#   * `a_pane_that_never_shows_the_prompt_refuses_instead_of_publishing_an_empty_reply`
#
# ⚠ THE CONTROL SAYS IT IS NOT THE CHANGE UNDER TEST. The full `-p sprag-plugin --lib` suite fails
# this way ON THE PARENT COMMIT too — a different member of the class each run, which is what a race
# looks like. And each one PASSES ALONE on the same machine (3/3), so it needs the other 130 tests
# running beside it at 32 threads.
#
# ⚠ The workstation does not show it: the same suite is green there. The suspicion is `ReadyWhen::
# Prints`, whose contract is *more* occurrences than when the barrier ARMED — on a fast enough box
# the fixture's own `printf` can land BEFORE the arming look, putting the marker in the baseline so
# it can never be exceeded. That is a hypothesis, not a finding: nobody has instrumented the arming
# count on the failing side. It is its own round, and it is a FIXTURE question rather than a product
# one until measured otherwise.
#
# ⚠⚠⚠ SETTLED 2026-08-13 (R374c) — THE HYPOTHESIS ABOVE WAS RIGHT, AND IT WAS BOTH QUESTIONS.
#
# The state is reproduced DETERMINISTICALLY rather than waited for, by opening on purpose the window
# a loaded box opens by accident: wait for the peer's announcement, THEN start a run whose
# `ready_when` is `prints` for it. That run produces the recorded signature exactly, and the gate
# asserts all three parts of it —
#
#     orchestrator::tests::a_run_the_clock_ended_at_the_barrier_says_what_it_was_waiting_for
#
# THE FIXTURE HALF. Every one of the four members ever observed is a fixture whose peer announces
# once on the way up and whose barrier then asks `Prints` for that announcement. The correlation is
# total, and the remedy was already written down in `testing::started`'s own doc and applied in one
# place: wait for the marker in the FIXTURE, then ask `Shows`, which is the question that reads a
# marker already on the screen. The four now do that.
#
# THE PRODUCT HALF, which is why this was never only a fixture question. A run that ends this way
# said NOTHING about a barrier: `Exhausted(Duration)` over `Bytes(0)` is advice to raise a time
# budget, about a wait that would never have cleared however long it ran. Whether a caller got the
# real diagnosis depended on which of `ready_within` and the run's own clock was shorter — arithmetic
# nobody chose. Both endings now carry it (`Reached::RunEnded`), and `PaneError::NeverReady` names
# the marker that is ALREADY ON SCREEN (`already_showing`), which is the correction itself.
#
# ⚠ EVIDENCE, on the build machine at 26-30 threads: before, three consecutive `-p sprag-plugin
# --lib` runs each failed with 1-3 members and the members differed every time; after, three
# consecutive runs and one full `--workspace --exclude sprag-gui` run (2690/0) are green. A green
# re-run proves nothing on its own — what carries this is the mechanism, the deterministic
# reproduction, and the fact that the failing members are exactly the fixtures with the defect.
#
# ⚠ THE FIRST CLASS ABOVE IS NOT CLOSED BY THIS. `a_hooks_report_does_not_outlive_an_agent_the_pane_
# did_not_spawn` was GREEN on the build machine in this round's full run, which is one reading of an
# intermittent red and therefore proves nothing. Its note stands.

# WHERE `peak_gb_per_task` CAME FROM — the readings, and what took them.
#
# One row per command in `[commands]`, keyed by that command's name. The command's own TEXT is
# recorded beside its number so that EDITING A COMMAND IS EDITING SOMETHING THE GATE COMPARES: a
# `verify` that grows a fifth clause is a different amount of work by a different program, and the
# ceiling that covered the old one is then a claim nobody re-checked. `*_kb` is kilobytes as the
# instrument reported them, not a rounded GB, so a re-run can be compared against this file.
#
# ⚠⚠ THE INSTRUMENT, because the obvious one was wrong. `/usr/bin/time -v` reports ru_maxrss of
# RUSAGE_CHILDREN, and it answered ~1.2GB for five workloads as different as a 5-second rustdoc
# pass and a 36-second cold build — a coincidence that turned out to be the largest rustc being the
# same crate every time, but which no reading of that number alone could distinguish from the
# instrument measuring `cargo` itself. The numbers here come from sampling /proc for the VmHWM of
# every process under the run, which is why each one can NAME what peaked.
#
# ⚠ EACH CLAUSE OF `verify` WAS MEASURED IN ITS OWN COLD TARGET DIRECTORY, and `verify_kb` is the
# largest of them: the chain stops at its first failure, so a single chained run measures only as
# far as it got — two attempts at the whole chain stopped in its first clause. Readings, same host
# and day, in kB:
#     cargo test --workspace --exclude sprag-gui     1192760   (rustc sprag_host)
#     cargo test -p sprag-gui --bins                 1201984   (rustc sprag_host)
#     cargo clippy --workspace --all-targets         1199108   (rustc sce_build)
#     cargo doc --workspace --no-deps                1233428   (rustdoc sprag_gui)  <- verify_kb
#
# ⚠⚠ THE SUITE ROW IS THE ONE THAT NEEDED FORCING, and it is the row that mattered: a suite that
# stops early says what a COMPILER peaks at and nothing about what a TEST peaks at. It was taken
# from `cargo build --workspace --bins && cargo test --workspace --exclude sprag-gui --no-fail-fast`
# — the bins first because the staleness gates refuse a binary `cargo test` never built, and
# `--no-fail-fast` so a red target does not end the run. 2150 processes sampled, the whole suite
# run, and NOT ONE TEST BINARY reached the top eight: the largest was 1192760 kB of rustc and the
# heaviest non-compiler was less than half that. On this workspace the ceiling is a compilation
# ceiling, which is why `build` and `verify` land within 3% of each other.
#
# ⚠⚠⚠ 6.5GB IS NOT HERE AND MUST NOT BE. That reading was `cargo doc --document-private-items`,
# which is the COMMIT HOOK's doc gate and is not a command this file sends — the same tree answers
# differently per command, which is why every row here carries the command that produced it. The
# hook has no ceiling of any kind and that is its own debt (register item 457), not this field's.
#
# ⚠ RESIDUE: the sampler follows the run's process group and its ancestry, so a descendant that
# calls `setsid` and outlives its parent — which sprag's own daemons do on purpose — can leave the
# tracked set. Every peak recorded here is a compiler, so nothing observed was lost this way; a
# reading whose `worst` is a sprag binary should be taken again with that in mind.
[peak_measured]
date = "2026-08-23"
# ⛔⛔ ONE PLATFORM FOR THE TABLE, the way `date` and `host` are one for it: both rows below were
# taken in the same session on the same machine. Item 1008's reason is at `precommit_platform`.
platform = "Linux"
host = "pc2, a 32-core build machine, rustc stable, via bx"
worst = "rustc --crate-name sce_build, in the first cargo test clause of verify"
build_cmd = "cargo test --workspace --no-run"
build_kb = 1204328
verify_cmd = "rc=0 ; cargo test --workspace --exclude sprag-gui --no-fail-fast > /tmp/sprag-verify-1.log 2>&1 || rc=1 ; cat /tmp/sprag-verify-1.log ; DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent/bus XDG_RUNTIME_DIR=/nonexistent cargo test -p sprag-gui --bins --no-fail-fast > /tmp/sprag-verify-2.log 2>&1 || rc=1 ; cat /tmp/sprag-verify-2.log ; cargo clippy --workspace --all-targets || rc=1 ; cargo doc --workspace --no-deps || rc=1 ; cargo run -q -p sprag-gate --bin sweep-coverage -- /tmp/sprag-verify-1.log /tmp/sprag-verify-2.log || rc=1 ; exit $rc"
verify_kb = 1638964

# ⚠⚠⚠ THE 2026-08-23 RE-MEASUREMENT, AND WHAT IT IS AND IS NOT — register item 623.
#
# `verify` was rewritten (register item 620) so it can no longer pass a subset, which made the row
# above a measurement of a command that no longer existed. The gate said so and this is its repair,
# taken with the instrument this repository now tracks:
#
#     bx -- bash crates/sprag-gate/tests/doubles/declared-verify/measure-peak verify
#
# ⚠ THE RUN WAS NOT GREEN AND THE NUMBER IS STILL THE RIGHT ONE. On a cold target `verify` runs
# without `build` before it, so `sprag-tui`'s pty suite refused 99 of its cases through
# `sprag_gate`'s own staleness guard — a binary `cargo test` never built. That is the staging of a
# clause-by-clause measurement, not a product failure, and the note above already says why it does
# not spoil the reading: **on this workspace the ceiling is a compilation ceiling**, and the worst
# process was a rustc either way.
#
# ⚠⚠ THE NUMBER ROSE 33% (1233428 -> 1638964) AND ONLY PART OF THAT IS THIS CHANGE. The new clause
# builds `sprag-gate`'s binaries, which the old command never did — but three days of dependency and
# toolchain drift sit in the same difference and nothing here separates them. Recorded as one
# reading with its date rather than split by a guess.
#
# ⚠⚠⚠ AND THE NEW CLAUSE EARNED ITSELF ON ITS FIRST REAL RUN: `sweep-coverage` reported *4 of 15
# crates ran NOTHING in this sweep — sprag-detect, sprag-client, sprag-conformance, sprag-gate*.
# Whether that is the cold run dying early or something else is UNMEASURED and is its own register
# item; what matters here is that the exit code alone would have said none of it.
